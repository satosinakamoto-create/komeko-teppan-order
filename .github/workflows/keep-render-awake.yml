# ============================================================================
#  Render を眠らせないための ping
# ----------------------------------------------------------------------------
#  Render の無料枠は 15 分の無通信でスリープし、次の起動に 158〜168 秒かかる。
#  採用担当は待たないので、公開時間帯だけ外から定期的に叩いて起こしておく。
#
#  ■ なぜ「時計」と「実行役」を分けてあるのか
#
#  この 2 つを両立できる単一のサービスが見つからなかったため。
#
#    ① 10 分おきに確実に発火すること
#    ② Render の休眠サービスを起こせること（＋ 168 秒待てること）
#
#  cron-job.org は ① だけできて ② ができない。
#  Render は cron-job.org（128.140.8.200 / Hetzner・ドイツ）からの要求では
#  休眠中のサービスを起こさず、即座に 503 を返す。理由はヘッダに出ている:
#
#      x-render-routing: hibernate-wake-error
#
#  x-render-origin-server が付かない ＝ オリジンに届いておらず、アプリは起動を
#  試みてすらいない。だから Render のアプリログにも何も残らなかった。
#  結果、毎朝 8:00 から失敗が続き、26 回目（12:10）で cron-job.org が
#  ジョブを自動無効化する、というのを 3 回（8/21・8/27・8/28）繰り返した。
#
#  GitHub Actions は ② だけできて ① ができない。
#  runner（Azure・20.161.78.74）からは起こせる（2026-08-29 実測: 167.6 秒で 200 OK、
#  x-render-origin-server: Render 付き）。しかし schedule は 1 日 3 回しか走らない
#  （8/30〜9/5 の実績。期待は 60 回）。
#
#  そこで **① を cron-job.org、② を GitHub Actions に担当させた。**
#  経緯の全文は docs\デプロイ.md を見ること。
#
#  ■ ここを直すときの注意
#
#  - タイムアウトは 240 秒。起動実測が 168 秒なので、30 秒では絶対に足りない。
#    UptimeRobot 等の監視サービスは大半が 30〜60 秒上限で、この時点で失格になる。
#  - cron は UTC 指定。JST 8:00〜17:50 は UTC の 23 時台と 0〜8 時台にあたる。
#  - **リポジトリを 60 日触らないと schedule は自動停止する。**
#  - 失敗すると GitHub がリポジトリ所有者にメールを送る。これが検知役を兼ねる
#    （cron-job.org の失敗通知は設定が正しくても 1 通も届かず、機能していなかった）。
# ============================================================================
name: keep-render-awake

# ■ トリガーが 2 本ある理由（2026-09-06 追記）
#
#   本命は workflow_dispatch のほう。schedule は保険。
#
#   schedule だけで運用した 8/30〜9/5 の実績は **1 日 3 回** だった（期待は 60 回）。
#   GitHub の公式ドキュメントに
#     「schedule イベントは高負荷時に遅延する。負荷が十分高い場合、
#      キューに入ったジョブは破棄されることがある」
#   とあり、public リポジトリのスケジュールは優先度を下げられる。
#   15 分で眠るサービスを 4〜5 時間おきに叩いても意味がない。
#
#   一方 **API 経由の workflow_dispatch は即座に拾われる**（優先度を下げられるのは
#   schedule だけ）。そこで「時計は cron-job.org、実行は GitHub」に分けた:
#
#       cron-job.org（10 分おきに正確に発火する。実績で確認済み）
#            ↓  POST /actions/workflows/keep-render-awake.yml/dispatches
#       GitHub Actions の runner（Render を起こせる。実測 157〜168 秒で 200）
#            ↓
#       komeko / 透明麻雀
#
#   cron-job.org の相手が GitHub API になるので必ず 204 が返る。
#   つまり **連続失敗による自動無効化（8/21・8/27・8/28 の原因）が起きない**。
#   設定手順は docs\デプロイ.md「叩き役の構成」を見ること。
#
#   schedule 側は minute を 0/10/20… から 3/13/23… にずらしてある。
#   GitHub が「毎時 0 分が最も混む。時刻をずらせば遅延しにくい」と案内しているため。
on:
  workflow_dispatch: # 本命。cron-job.org がこれを API で叩く（手動実行もできる）
  schedule:
    # 保険。JST 8:00〜17:50（UTC 23 時台と 0〜8 時台）。混む毎時 0 分を避けている
    - cron: "3,13,23,33,43,53 23,0-8 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: komeko を起こす
        run: |
          curl -sS --fail -o /dev/null --max-time 240 \
            -w "komeko   http=%{http_code}  time=%{time_total}s\n" \
            https://komeko-teppan-order.onrender.com/ping

      - name: 透明麻雀を起こす
        # komeko が落ちても麻雀は叩く。片方の失敗で、もう片方を巻き添えにしない。
        if: always()
        run: |
          curl -sS --fail -o /dev/null --max-time 240 \
            -w "mahjong  http=%{http_code}  time=%{time_total}s\n" \
            https://toumei-mahjong.onrender.com/ping

      - name: 失敗したときだけ、原因が分かるヘッダを残す
        # 2026-08 の 3 回の停止が毎回「原因不明」で終わったのは、
        # 応答ヘッダを一度も記録していなかったから。同じ轍を踏まないために置く。
        if: failure()
        run: |
          echo "===== runner の送信元 ====="
          curl -sS --max-time 20 https://ipinfo.io/json || true
          echo
          for u in https://komeko-teppan-order.onrender.com/ping \
                   https://toumei-mahjong.onrender.com/ping; do
            echo "===== $u ====="
            curl -sS -D - -o /dev/null --max-time 60 "$u" || true
            echo
          done
          echo "----------------------------------------------------------------"
          echo "x-render-routing: hibernate-wake-error → Render が起床を拒否している。"
          echo "  この runner の送信元まで弾かれるようになった可能性。docs\\デプロイ.md 参照。"
          echo "x-render-origin-server: Render がある    → オリジンには届いている（別の問題）。"
