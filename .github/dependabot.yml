# ============================================================================
#  Dependabot の設定
# ----------------------------------------------------------------------------
#  このファイルは GitHub にリポジトリを push すると自動で有効になります
#  （ローカルの git だけの間は何もしません）。
#
#  有効になると GitHub が:
#    1. 使っているライブラリ（pom.xml）に脆弱性が見つかったら通知してくれる
#    2. 新しいバージョンが出たら「更新するプルリクエスト」を自動で作ってくれる
#
#  つまり「更新が来たら通知が来るの？」への答えがこのファイルです。
#  セキュリティは作って終わりではなく、この仕組みで回し続けるのが本体です。
#
#  更新 PR が来たら:  内容を見る → ローカルで .\tools\run.ps1 -Test → 通ればマージ
# ============================================================================
version: 2
updates:
  # Maven（Java の依存ライブラリ）
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"    # 週1回まとめて確認（毎日だと通知疲れする）
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # GitHub Actions を将来使う場合に備えて（いまは無くても害はない）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
