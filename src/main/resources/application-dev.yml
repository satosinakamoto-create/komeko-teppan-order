#
# ============================================================================
#  dev プロファイル : 手元の開発用
# ============================================================================
#  H2 という「ファイル 1 つで動く DB」を使うので、MySQL や PostgreSQL を
#  インストールしなくてもそのまま起動できる。
#  DB の実体は ./data/komeko.mv.db に作られる（.gitignore 済み）。
# ============================================================================
spring:
  datasource:
    # DB_CLOSE_ON_EXIT=FALSE:
    #   H2 は既定で「JVM 終了時に自分で DB を閉じる」フックを仕掛けるが、
    #   それが Spring の終了処理（終了時バックアップなど）より先に走ると困るので無効化する。
    #
    # ※ ここに AUTO_SERVER=TRUE（別プロセスからの同時接続を許す設定）を
    #   足してはいけない。H2 2.x では DB_CLOSE_ON_EXIT との併用が
    #   「機能はサポートされていません」エラーになり、起動できなくなる。
    #   実際に初回起動で踏んだ実話（テストは自分専用の URL を使うため、
    #   この行の間違いはテスト 220 件では検出できなかった）。
    url: jdbc:h2:file:./data/komeko;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # update = エンティティの定義に合わせてテーブルを自動で作り・足す。
      # 学習中はこれが一番ラク。本番で使ってはいけない（下の prod 参照）。
      ddl-auto: update
    show-sql: false

  h2:
    console:
      # http://localhost:8080/h2-console でブラウザから DB の中身を見られる
      enabled: true
      path: /h2-console

  thymeleaf:
    # false にすると HTML を保存しただけで画面に反映される（再起動不要）
    cache: false

  devtools:
    restart:
      enabled: true

# ── アクセスログ（開発用） ──────────────────────────────────────
# 「スマホから開けない」の切り分けで一番効くのがこれ。
# ここに行が出る＝リクエストはサーバまで届いている（アプリ側の問題）、
# 出ない＝途中で消えている（Wi-Fi・ファイアウォール・スマホ側の問題）と
# 一発で二分できる。data/logs/access_log.*.log に記録される。
server:
  tomcat:
    basedir: ./data/tomcat
    accesslog:
      enabled: true
      directory: logs
      pattern: "%h %t \"%r\" %s %b"

# ※ thymeleaf と devtools の設定は spring: の下にある（上を見ること）。
#   ここ（server: の下）に書いてあったが、server.thymeleaf.cache という
#   キーは存在しないので、まったく効いていなかった。
#   いま画面が保存しただけで反映されるのは devtools が同じ既定値を
#   自分で入れているからで、devtools を外すと黙って効かなくなる状態だった。

logging:
  level:
    jp.komeko.order: DEBUG

# お客さまのスマホ画面を、PC で実寸のまま見るための確認用ページ（/dev/phone）。
#
# PC のブラウザでお客さま側を開くと窓の幅いっぱいに広がり、実機とは違う形になる。
# Chrome の端末モード（F12 のあと Ctrl+Shift+M）でも同じことはできるが、
# F12 だけでは切り替わらず、端末の選び直しや倍率でも見え方が変わる。
#
# ★ 本番（application-prod.yml）には書かないこと。
#   書かなければ DevPhonePreviewController の Bean が作られず、URL は 404 になる。
app:
  dev-tools: true
