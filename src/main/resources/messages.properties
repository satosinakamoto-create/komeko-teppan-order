# ============================================================================
#  メッセージ定義
# ----------------------------------------------------------------------------
#  画面に出す文言をここにまとめておくと、あとから多言語対応するときに
#  messages_en.properties を足すだけで済みます（application.yml の
#  spring.messages.basename でこのファイルを指定しています）。
#
#  現状はほとんどの文言をテンプレート／アノテーションに直接書いているため、
#  ここには「共通で使い回すもの」と「Spring が自動で参照するもの」だけを置いています。
#  文言を統一したくなったら、ここへ移していってください。
#
#  ※ このファイルは UTF-8 で保存すること（Spring Boot は UTF-8 で読みます）。
# ============================================================================

# ---- 共通ボタン・ラベル ----
label.save=保存する
label.cancel=キャンセル
label.delete=削除する
label.back=戻る

# ---- 共通メッセージ ----
message.saved=保存しました
message.deleted=削除しました
message.notFound=見つかりませんでした

# ---- Bean Validation の既定文言を日本語にする ----
# （アノテーションに message を書いていない項目に効きます）
jakarta.validation.constraints.NotBlank.message=入力してください
jakarta.validation.constraints.NotNull.message=入力してください
jakarta.validation.constraints.Size.message={min}〜{max} 文字で入力してください
jakarta.validation.constraints.Min.message={value} 以上の値を入力してください
jakarta.validation.constraints.Max.message={value} 以下の値を入力してください

# ---- 型変換に失敗したとき（例: 数値欄に文字を入れた） ----
typeMismatch.java.lang.Integer=数値を入力してください
typeMismatch.java.lang.Long=数値を入力してください
typeMismatch.java.time.LocalTime=時刻を HH:mm の形式で入力してください
typeMismatch.java.time.LocalDate=日付を入力してください
typeMismatch=入力形式が正しくありません
