<!DOCTYPE html>
<!--/*
   食材の新規登録。

   入力してもらうのは名前と単位だけでいい、という作りにしている。
   警告残量も単価の固定も後から足せるので、
   最初の 1 件を登録するときに考えることを増やさない。
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout('食材を追加', ~{::main})}">
<body>
<main>

  <div th:replace="~{fragments/common :: flash}"></div>

  <!--/* 見出しの帯（設計 ト04b 838:9207・部品は 見出し/ページ 24:1392）。
         補足は Figma どおり常時出す。「レシピ編集から来たときは」という条件付きの
         言い方なので、来ていないときに読んでも嘘にならない */-->
  <div class="page-head">
    <a class="btn" th:href="@{/inventory/ingredients}">← 食材・在庫へ戻る</a>
    <h1 class="page-head__title">食材を追加</h1>
    <span class="page-head__sub">レシピ編集から来たときは、保存後にそこへ戻ります</span>
    <span class="page-head__spacer"></span>
  </div>

  <!--/* どのレシピから来たかを名指しする（設計 838:9213）。
         ★ 商品名は Service で文字列にしてもらったものを受け取る（returnToName）。
           ここで menuItem.name と辿ると、open-in-view:false のせいで描画時に落ちる。
         ★ 商品が消えていれば returnToName は null。そのときは案内ごと出さない
           （「『』のレシピ編集から来ました」は、ただの壊れた表示） */-->
  <!--/* ★ 商品名を <span> で挟まないこと。
         「『<span>肉玉米粉そば</span>』のレシピ編集から…」と書くと、
         出来上がった HTML の途中にタグが入って 1 つの文になりません。
         読み上げも「肉玉米粉そば」で切れます。文ごと th:text で組み立てる */-->
  <div class="alert alert--info" th:if="${returnToName != null}">
    <p class="mb-0"
       th:text="'「' + ${returnToName} + '」のレシピ編集から来ました。登録するとレシピへ戻ります'">
      「肉玉米粉そば」のレシピ編集から来ました。登録するとレシピへ戻ります
    </p>
  </div>

  <form th:action="@{/inventory/ingredients}" method="post" th:object="${ingredientForm}" class="card">
    <!--/* 来た道（レシピ編集など）。保存後にそこへ戻すための持ち回り。
           サーバ側は /inventory/recipes/数字 の形しか信じない（オープンリダイレクト防止） */-->
    <input type="hidden" name="returnTo" th:value="${returnTo}">
    <div class="card__body">

      <div th:if="${#fields.hasErrors('*')}" class="alert alert--error">
        <p class="mb-0" th:each="e : ${#fields.allErrors()}" th:text="${e}">エラー</p>
      </div>

      <!--/* 入力は 3 列 → 2 列（もとは設計 838:9218 の 3 列 × 2 行）。
             2026-09-16 に分類をやめて 6 項目が 5 項目になった。
             3 列 × 2 行のままだと空のセルが 1 つできる——
             それは分類を足す前の 2 列 × 4 行で嫌って直した形そのものなので、
             戻さない。警告残量を 1 行目へ繰り上げ、2 行目は 2 列にする。
             メモは横幅があったほうが書きやすいので、こちらの並びのほうが素直。 */-->
      <div class="grid grid--3">
        <div class="field">
          <label class="label" for="name">食材名</label>
          <input class="input" type="text" id="name" th:field="*{name}" placeholder="キャベツ">
          <p class="help">店の中で通じる呼び方で構いません</p>
        </div>
        <div class="field">
          <label class="label" for="unit">単位</label>
          <select class="select" id="unit" th:field="*{unit}">
            <option th:each="u : ${units}" th:value="${u}"
                    th:text="${u.label} + '（' + ${u.symbol} + '）'">グラム（g）</option>
          </select>
          <p class="help">
            グラム数が分かる食材は g、袋のまま数えるものは「パック」や「袋」を選んでください
          </p>
        </div>
        <div class="field">
          <label class="label" for="lowThresholdQty">警告残量（任意）</label>
          <input class="input" type="number" step="0.001" min="0"
                 id="lowThresholdQty" th:field="*{lowThresholdQty}" placeholder="500">
          <p class="help">これを下回ったら一覧で赤くします。空欄なら警告しません</p>
        </div>
      </div>

      <div class="grid grid--2">
        <div class="field">
          <label class="label" for="costOverride">単価を固定する（任意）</label>
          <input class="input" type="number" step="0.0001" min="0"
                 id="costOverride" th:field="*{costOverride}" placeholder="0.12">
          <p class="help">
            空欄でかまいません。ふだんは<strong>最新の仕入価格を自動で使います</strong>ので、
            昨日の値上がりが今日の原価率にそのまま出ます
          </p>
        </div>
        <div class="field">
          <label class="label" for="memo">メモ（任意）</label>
          <input class="input" type="text" id="memo" th:field="*{memo}"
                 placeholder="冷蔵庫の下段 / ◯◯商店に発注 など">
        </div>
      </div>

      <!--/* ボタンとその補足（設計 838:9245）。補足はボタンの右に置く。
             ★ もとはカードの外に「登録しただけでは在庫は 0 のままです」と書いていた。
               Figma はここで単価の話をしている。登録した直後に原価が出ないのは
               「壊れている」と見えやすいので、その断りを先に読ませるという判断。
               在庫が 0 から始まることは、詳細画面の「棚卸しをしていない」案内で伝わる */-->
      <div class="row row--wrap">
        <button type="submit" class="btn btn--primary">この内容で登録する</button>
        <p class="help mb-0">
          登録した直後は単価が分かりません。レシートを 1 枚登録すると原価に入ります
        </p>
      </div>
    </div>
  </form>

</main>
</body>
</html>
