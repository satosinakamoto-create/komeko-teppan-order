<!DOCTYPE html>
<!--/*
   ======================================================================
    店舗スタッフ用ログイン画面
   ----------------------------------------------------------------------
    Spring Security の formLogin が使う画面です。
    SecurityConfig では次のように設定されています。

        .formLogin(form -> form
                .loginPage("/login")            ← この画面を出す URL
                .loginProcessingUrl("/login")   ← ID とパスワードを送る先
                .failureUrl("/login?error")     ← 失敗したら ?error 付きで戻る
                ...)
        .logout(logout -> logout
                .logoutSuccessUrl("/login?logout"))  ← ログアウト後は ?logout 付き

    つまりこの 1 枚で「入力フォーム」「失敗の通知」「ログアウト完了の通知」の
    3 つを担当します。?error / ?logout が付いているかで表示を切り替えます。

    レイアウトは layout/plain（ヘッダーもナビも無い最小構成）。
    ログイン前なのでナビゲーションを出しても押せる先が無く、
    かえって迷わせるためです。layout/staff は ${shop} を参照しますが、
    layout/plain は参照しないので、店名は固定文言にしています。
   ======================================================================
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/plain :: layout('ログイン', ~{::main})}">
<body>
<!--/* loginpage は CSS の目印。この画面だけの寸法は app.css の 36 節にあります
       （設計 現08 ログイン 641:5267 / 2026-09-12）。

       ★ 2026-09-12 まで、寸法は style 属性で直接書いてありました。
         「app.css は自分の担当ではないので触らない」という理由でしたが、
         いまは画面ごとに目印を付けて app.css に書く形（.hallboard /
         .kitchenboard / .soldoutpage）で揃っているので、そちらに移しました。
         同じ値が HTML と CSS に散らないほうが、あとで設計と突き合わせやすいためです。 */-->
<main class="page loginpage">

  <!--/*
     縦センタリング。
     .page が min-height:100dvh の縦フレックス、.page__body が flex:1 なので、
     この div は画面の残り全部の高さを持ちます。そこへ grid + align-content:center を
     かけると、中身が上下の中央に来ます（36 節）。
  */-->
  <div class="container page__body loginpage__body">

    <!--/* ===== 店名 =====
           お客さま側の「のれん」ではなく、スタッフが使う道具の見出しにします。
           もとは明朝の指定（.serif）＋字間 .22em でしたが、
           .theme-snow が --font-serif をゴシックに潰しているので明朝にはならず、
           広い字間だけが残って「お客さま側の画面」に見えていました。
           設計では 24px 太字・字間 2px です。 */-->
    <div class="loginpage__brand">
      <!--/* ★ ロゴの紋（2026-09-23・店主の指示「ロゴの画像も追加して」）。
             設計 ト08 / トi08 / トp08 の 6 枚にも同じ 72px の円で入れてあります。

             店名の書体を明朝（--font-brand）にしたのは、この紋の中の
             「米粉と鉄板」と字をそろえるためです。紋だけ明朝で隣がゴシックだと、
             同じ言葉が 2 種類の字で並びます。 */-->
      <img class="loginpage__logo" th:src="@{/images/logo.jpg}"
           th:alt="${shop.shopName} + ' ロゴ'">
      <h1 class="loginpage__name">米粉と鉄板</h1>
      <p class="loginpage__role">店舗管理</p>
    </div>

    <!--/*
       カード本体。幅は設計どおり 400px（狭い画面では端まで）。
       ログインは入力が 2 つしかないので、広げても空白が増えるだけです。
    */-->
    <div class="card loginpage__card">
      <div class="card__body stack">

        <!--/*
           ===== ログイン失敗のお知らせ =====
           ${param.xxx} は「URL のクエリ文字列に xxx が付いているか」を見る書き方です。
           /login?error でアクセスされたときだけ表示されます。
           「値があるか」ではなく「付いているか」を見たいので、
           中身の比較ではなく != null で判定しています（?error は値が空のため）。

           セキュリティ上、「ユーザー名が無い」のか「パスワードが違う」のかは
           区別して伝えません。どちらか分かると、存在するユーザー名を
           総当たりで探せてしまうためです（SecurityConfig の
           hideUserNotFoundExceptions と同じ考え方）。
        */-->
        <div class="alert alert--error" th:if="${param.error != null}" role="alert">
          <p class="mb-0">ユーザー名またはパスワードが違います</p>
        </div>

        <!--/* ===== ログアウト完了のお知らせ（/login?logout） ===== */-->
        <div class="alert alert--success" th:if="${param.logout != null}" role="status">
          <p class="mb-0">ログアウトしました</p>
        </div>

        <!--/*
           ===== 入力フォーム =====
           th:action を使うのが必須です。
           Thymeleaf は th:action の付いた form に CSRF トークンの
           <input type="hidden" name="_csrf" ...> を自動で差し込みます。
           素の action="/login" で書くとトークンが入らず 403 になります。

           name は username / password 固定。
           Spring Security が既定でこの名前のパラメータを読むためです。
        */-->
        <form th:action="@{/login}" method="post">

          <div class="field">
            <label class="label" for="username">ユーザー名</label>
            <!--/*
               autocomplete を正しく書くと、ブラウザやパスワード管理アプリが
               「ここは ID 欄」「ここは今のパスワード欄」と理解して
               保存済みの値を出してくれます。開店前の慌ただしい時間に
               手入力を減らせるので、地味ですが効きます。
               autofocus は画面を開いた瞬間にカーソルを置く指定です。
            */-->
            <input class="input" type="text" id="username" name="username"
                   maxlength="40" required autofocus
                   autocomplete="username"
                   autocapitalize="off" spellcheck="false"
                   placeholder="例）admin">
          </div>

          <div class="field">
            <label class="label" for="password">パスワード</label>
            <input class="input" type="password" id="password" name="password"
                   required
                   autocomplete="current-password"
                   placeholder="パスワード">
          </div>

          <!--/*
             高さは 48px（設計 現08）。--tap の下限ちょうどです。
             もとは .btn--lg（56px）で「濡れた手でも押せるように」としていましたが、
             この画面を触るのは開店前にログインする 1 回だけで、
             鉄板の前で押すボタンではありません。厨房ボードの操作ボタンは 56px のままです。
          */-->
          <button type="submit" class="btn btn--primary btn--block">ログイン</button>
        </form>

        <!--/*
           ===== ゲストで参加する（ポートフォリオのデモ用） =====
           ${guestLogin} は app.guest-login=true のときだけ true になります。
           実店舗の設定では false なので、このボタンは出ません。

           GET のリンクではなく POST のボタンにしています。
           リンクにすると、外部のサイトに <img src=".../login/guest"> と書かれるだけで
           見に来た人が意図せずログイン状態にされてしまうためです。
           POST なら CSRF トークンが要るので、この画面のボタンからしか実行できません。
        */-->
        <div th:if="${guestLogin}" class="stack mt-4">

          <!--/* ★ やり直しの案内（/login?retry=1）。
                 もとは /demo/staff が持っていました。あちらを /login へ転送するので、
                 受け取る先もこちらへ移します。

                 CSRF のトークンが古くなるのは、戻るボタンでの再表示か、
                 無料枠でインスタンスが入れ替わってセッションが消えたときです。
                 どちらも防げないので、403 で行き止まりにせず、やり直せる形で戻します。
                 「もう一度お試しください」だけだと同じことを繰り返す人が多いので、
                 原因と次の一手を書きます。 */-->
          <div class="alert alert--warn" th:if="${param.retry != null}" role="alert">
            <p class="mb-0 small">
              前の画面が古くなっていたため、いったん止めました。<br>
              <strong>下のボタンを押すと進めます。</strong>
            </p>
          </div>

          <!--/* ★ 色は --text-faint ではなく --text-muted。
                 .theme-snow の --text-faint は rgba(28,28,28,.38)＝実効 #a9a9a9 で、
                 白地に対して 2.35:1 しかありません。2026-09-22 に
                 「補足は --text-muted に揃える」と決めた件と同じ話です
                 （app.css 393 行）。 */-->
          <div class="row loginpage__or" style="align-items:center;gap:var(--sp-3)">
            <hr style="flex:1;border:0;border-top:1px solid var(--border)">
            <span class="tiny">または</span>
            <hr style="flex:1;border:0;border-top:1px solid var(--border)">
          </div>

          <form th:action="@{/login/guest}" method="post">
            <!--/* ★ 文言は「ゲストとして見る（店舗UI）」
                   （2026-09-23・店主の指示）。

                   もとは「ゲストで参加する」でした。参加という語は
                   <b>何かを書き換えられる</b>ように読めますが、実際は見学モードで
                   表示のみです（保存・削除はできません）。
                   「見る」と言い切り、どちら側の画面かを括弧で添えます。
                   お客さま側の入口と並べたときに、選ぶ手がかりになります。 */-->
            <button type="submit" class="btn btn--block loginpage__guest">ゲストとして見る（店舗UI）</button>
          </form>

          <!--/* ★ 2 行に収めること（2026-09-23）。
                 3 行あると、iPad（1024x781）でログイン画面が画面の高さを
                 10px 超えます。実害はスクロールだけですが、1 画面に収まらない
                 ログイン画面は、それだけで「まだ何かある」ように見えます。

                 もとは「注文の状態を進めると、お客さまのスマホ画面もその場で
                 変わります。」で、iPad のカード幅 334px に入らず折り返していました。
                 意味は変えずに短くしてあります。 */-->
          <!--/* ★ 「見学モード」と「架空のデータ」は必ず書くこと。
                 もとは /demo/staff の説明カードにありました。あちらを転送にするので、
                 ここが唯一の告知になります。

                 docs\ポートフォリオ.md の「必ず併記すること」に入っている項目で、
                 これが無いと、見学者は<b>本物の店の売上を見ている</b>と受け取ります。
                 保存や削除ができないことも先に伝えないと、
                 押しても変わらないボタンを壊れていると思われます。 */-->
          <p class="tiny mb-0 center loginpage__guest-note">
            見学モードのため表示のみです。データはすべて架空です。<br>
            厨房ボードとホール画面をお試しいただけます。<br>
            注文を進めると、お客さまの画面もその場で変わります。
          </p>
        </div>

        <!--/* ===== 初回セットアップ向けの注記 =====
               2026-09-12 に .card__foot（カードの外に付く帯）から
               カードの中へ移しました。設計 現08 では、入力欄・ボタンと同じ
               32px の内側にあり、間隔も同じ 20px です。
               帯にすると罫線が 1 本増え、注記だけが別の箱に見えていました。

             ★ 公開デモでは出しません（2026-09-23・店主の判断）。

               これは<b>お店が初めて立ち上げるときの手順</b>です。
               見学者はサーバのログを見られませんし、そもそもパスワードで
               ログインせず「ゲストとして見る」を押すだけなので、
               読んでも何もできません。案内が 1 つ増えるだけです。

               ${guestLogin} が true のときだけ隠します。
               実店舗（既定の false）では今までどおり出ます。ここを消すと、
               初期パスワードの探し方が画面から辿れなくなります。 */-->
        <p class="loginpage__note" th:unless="${guestLogin}">
          初期アカウントはサーバのログに出力されます。<br>
          ログイン後、管理画面 → スタッフ管理 からパスワードを変更してください。
        </p>

      </div>
    </div>

    <!--/* お客さん向けメニューへの出口。QR を読み損ねたときの逃げ道にもなります。 */-->
    <p class="loginpage__link"><a th:href="@{/}">お客様向けメニューを見る</a></p>

  </div>
</main>
</body>
</html>
