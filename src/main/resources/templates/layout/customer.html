<!DOCTYPE html>
<!--/*
  ============================================================================
   お客さん向け画面の共通レイアウト
  ============================================================================
   Thymeleaf の「フラグメント」機能で、各ページの共通部分をここにまとめています。

   使い方（各ページ側）:
     <html th:replace="~{layout/customer :: layout('メニュー', ~{::main})}">
     <body>
       <main> ページ固有の中身 </main>
     </body>
     </html>

   ・第1引数  ページタイトル
   ・第2引数  ~{::main} = 「そのページの <main> 要素」という意味の式。
              これがこのファイルの <main th:replace="${content}"> と差し替わります。

   なお、この <!--/* ... */--> というコメントは Thymeleaf 専用のコメントで、
   出力される HTML には残りません（お客さんには見えません）。
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title th:text="${pageTitle} + ' | ' + ${shop.shopName}">米粉と鉄板</title>
  <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!--/* theme-snow: SnowUI トンマナ（白基調・黒の透過階調）。
       2026-08-18 にスタッフ側と統一した。和モダン版に戻したいときは
       この class を外すだけで生成り／きつね色／明朝に戻る（トークンが両方残っているため） */-->
<body class="theme-snow">
<div class="page">

  <header class="app-header">
    <div class="container app-header__inner">
      <!--/* 店のロゴ（公式サイトと同じもの）。丸くトリミングして「のれんの紋」として置く */-->
      <a th:href="@{/}" aria-hidden="true" tabindex="-1">
        <img class="brand-logo" th:src="@{/images/logo.jpg}" th:alt="${shop.shopName} + ' ロゴ'">
      </a>
      <div>
        <a class="app-header__title" th:href="@{/}" th:text="${shop.shopName}">米粉と鉄板</a>
        <p class="app-header__sub" th:if="${tableName == null}" th:text="${shop.tagline}">
          グルテンフリーの米粉生地で焼き上げる鉄板料理</p>
        <p class="app-header__sub" th:if="${tableName != null}" th:text="${tableName}">3番テーブル</p>
      </div>
      <nav class="app-header__nav">
        <a th:href="@{/bill}" th:if="${bill != null}">
          お席の伝票
          <span class="badge badge--rec" style="margin-left:4px"
                th:text="'¥' + ${#numbers.formatInteger(bill.totalAmount, 1, 'COMMA')}">¥0</span>
        </a>
        <!--/* 「カート」は通販の言葉なので使いません。飲食店なら「注文リスト」。
               ここに出ているのは、まだ厨房に送っていない“これから頼むもの”です。 */-->
        <a th:href="@{/cart}" th:if="${cartCount != null and cartCount > 0}">
          注文リスト
          <span class="badge badge--rec" style="margin-left:4px" th:text="${cartCount}">0</span>
        </a>

        <!--/*
          未確定のお知らせ。
          「追加した＝注文した」と思われたまま待たれるのが、実店舗でいちばん困ります。
          注文リストに品が入っているあいだ、押すべき場所（右上の注文リスト）を
          指し続ける吹き出しを出します。

          注文リストの画面自体では出しません。そこには
          「いちばん下のボタンを押してください」がすでに書いてあり、
          同じことを二重に言うと、かえって読み飛ばされます。
        */-->
        <div class="pending-note" role="status"
             th:if="${cartCount != null and cartCount > 0 and !#strings.contains(currentPath ?: '', '/cart')}">
          まだ注文は確定していません
        </div>
      </nav>
    </div>
  </header>

  <div class="page__body">
    <!--/* 各ページの <main> がここに入る */-->
    <div th:replace="${content}">ページ本文</div>
  </div>

  <footer class="app-footer">
    <div class="container">
      <p class="mb-0" th:text="${shop.shopName}">米粉と鉄板</p>
      <p class="mb-0">お会計はご退店時にレジまでお願いします</p>
      <p class="mb-0 tiny">20歳未満の方への酒類のご提供はできません</p>
    </div>
  </footer>

</div>

<!--/*
  お客さん向けの JavaScript は、ここ（レイアウト）で 1 回だけ読み込む。

  もとは商品詳細と伝票の 2 画面だけが個別に読み込んでいた。
  そのため「人数を決める」「注文を確定する」という<b>いちばん待たされる操作</b>に
  何のふるまいも付いていなかった。

  公開デモは 1 リクエストにおよそ 1 秒かかる（無料枠の CPU）。
  押しても画面が変わらない 1 秒は、待ち時間ではなく<b>故障</b>に見える。
  実際「反応が無くて固まる」と言われたのはこの画面だった。

  読み込む場所を各ページからレイアウトへ移すことで、
  「新しい画面を足したら、そこだけ反応が無い」も起こらなくなる。
*/-->
<script th:src="@{/js/customer.js}" defer></script>
</body>
</html>
