<!DOCTYPE html>
<!--/*
  ============================================================================
   お客さん向け画面の共通レイアウト
  ============================================================================
   Thymeleaf の「フラグメント」機能で、各ページの共通部分をここにまとめています。

   使い方（各ページ側）:
     <html th:replace="~{layout/customer :: layout('メニュー', ~{::main})}">
     <body>
       <main> ページ固有の中身 </main>
     </body>
     </html>

   ・第1引数  ページタイトル
   ・第2引数  ~{::main} = 「そのページの <main> 要素」という意味の式。
              これがこのファイルの <main th:replace="${content}"> と差し替わります。

   なお、この <!--/* ... */--> というコメントは Thymeleaf 専用のコメントで、
   出力される HTML には残りません（お客さんには見えません）。
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--/* 端末の上下の帯（時計やホームバーの背景）も画面と同じ黒にする。
         ここが白いままだと、暗い画面の上下に白い縁が残って安っぽく見える */-->
  <meta name="theme-color" content="#141414">
  <meta name="robots" content="noindex">
  <title th:text="${pageTitle} + ' | ' + ${shop.shopName}">米粉と鉄板</title>
  <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!--/* theme-night: お客さまの注文画面の配色（暗い地＋きつね色）。
       2026-09-05 に白基調（theme-snow）から入れ替えた。
       店の照明の下、片手のスマホで見る画面なので、地を落として料理の写真を浮かせる。
       配色の実体は app.css の 21-2 節。 */-->
<body class="theme-night" th:with="seated=${tableName != null}">
<div class="page" th:classappend="${seated} ? 'page--seated'">

  <!--/* ============ 上の大分類タブ ============ 2026-09-05

        卓に着いているときだけ出す。QR を読んでいない人には行き先が無い。

        4 つに絞ったのは、親指の届く範囲に収まる数だから。
        「お食事／ドリンク」で品を選び、「サービス」で取り皿やお冷やを頼み、
        「伝票・会計」でいまいくらかを見る。注文の流れがこの並びで完結する。

        現在地はきつね色。暗い地の上ではきつね色だけが押せる色なので、
        ここを他の色にすると「いまどこにいるか」が読めなくなる。 */-->
  <nav class="tabbar" th:if="${seated}" aria-label="メニューの大分類"
       th:with="p=${currentPath} ?: ''">
    <a class="tabbar__item" th:href="@{/menu}"
       th:classappend="${(p == '/' or p == '/menu' or #strings.startsWith(p, '/items'))
                         and drinkSection != true} ? 'is-active'">
      <th:block th:replace="~{fragments/icons :: ic_fork_knife}"/><span>お食事</span>
    </a>
    <a class="tabbar__item" th:href="@{/menu(tab='ドリンク')}"
       th:classappend="${drinkSection} ? 'is-active'">
      <th:block th:replace="~{fragments/icons :: ic_beer}"/><span>ドリンク</span>
    </a>
    <a class="tabbar__item" th:href="@{/service}"
       th:classappend="${#strings.startsWith(p, '/service')} ? 'is-active'">
      <th:block th:replace="~{fragments/icons :: ic_bell}"/><span>サービス</span>
    </a>
    <a class="tabbar__item" th:href="@{/bill}"
       th:classappend="${#strings.startsWith(p, '/bill')} ? 'is-active'">
      <th:block th:replace="~{fragments/icons :: ic_receipt}"/><span>伝票・会計</span>
    </a>
  </nav>

  <!--/* 卓に着いていない画面（QR を読む前）は、店名だけの静かな頭を出す */-->
  <header class="app-header" th:unless="${seated}">
    <div class="container app-header__inner">
      <a th:href="@{/}" aria-hidden="true" tabindex="-1">
        <img class="brand-logo" th:src="@{/images/logo.jpg}" th:alt="${shop.shopName} + ' ロゴ'">
      </a>
      <div>
        <a class="app-header__title" th:href="@{/}" th:text="${shop.shopName}">米粉と鉄板</a>
        <p class="app-header__sub" th:text="${shop.tagline}">
          グルテンフリーの米粉生地で焼き上げる鉄板料理</p>
      </div>
    </div>
  </header>

  <div class="page__body">
    <!--/* 各ページの <main> がここに入る */-->
    <div th:replace="${content}">ページ本文</div>
  </div>

  <!--/* ============ 下の固定カートバー ============ 2026-09-05

        注文リストに品が入っているあいだ、画面のいちばん下に貼り付く。

        ★ 「注文未確定」を金額と同じ場所に置く理由
          実店舗でいちばん困るのは「追加した＝注文した」と思われたまま待たれること。
          以前は右上に吹き出しを出していたが、スクロールすると消えるうえ、
          押すべき場所（注文へ進む）から離れていた。
          いまは<b>気づく場所と押す場所が同じ</b>になっている。

        ★ 注文リストの画面では出さない
          そこには「この内容で注文する」が本文の中にあり、二重になる。 */-->
  <a class="cartbar" th:href="@{/cart}"
     th:if="${seated and cartCount != null and cartCount > 0
              and !#strings.contains(currentPath ?: '', '/cart')}">
    <span class="cartbar__text">
      <span class="cartbar__note" th:text="'注文未確定　' + ${cartCount} + '点'">注文未確定　4点</span>
      <span class="cartbar__total"
            th:text="'¥' + ${#numbers.formatInteger(cartTotal ?: 0, 1, 'COMMA')}">¥3,150</span>
    </span>
    <span class="cartbar__go">注文へ進む →</span>
  </a>

  <!--/* ============ 品を選ぶモーダル ============ 設計「暗05 トッピングを選ぶ」

        メニューで品を押すと、画面を離れずにここへ中身が入る。
        中身は商品ページ（/items/{id}）をそのまま持ってきたもので、
        作りは 1 つしかない。モーダル用に別の HTML を書くと、
        オプションの出し方や個数の増減が 2 か所に分かれて必ずずれる。

        ★ JavaScript が動かないときは、ふつうに商品ページへ移動する。
          リンクは本物の <a href> のままにしてあるので、
          何もしなくてもその動きになる（JS は押されたときに横取りするだけ）。

        <dialog> を使うのは、開いているあいだ後ろを触れなくする仕組みと
        Esc で閉じる動きが、ブラウザ側に最初から入っているため。
        自前で作ると、背面のスクロールが動く・Esc が効かない、を必ず踏む。 */-->
  <dialog class="sheet-modal" id="item-modal" aria-label="ご注文の内容">
    <!--/* ★ 閉じるボタンは器の側に置く（中身と一緒に差し替えない）。

           設計（暗05）には無い。設計のモーダルは中身が収まっていて、
           下の「やめる」がいつでも見えているから要らなかった。
           実装は説明文や焼き上がりの目安が入るぶん背が高く、
           「やめる」がスクロールしないと出てこない品がある。
           閉じる手段がいつでも目に入る場所に無いと、行き止まりに見える。

           写真の上に重なるので、丸い面を敷いて字を浮かせている。 */-->
    <button type="button" class="sheet-modal__close" data-close-modal aria-label="閉じる">
      <th:block th:replace="~{fragments/icons :: ic_x}"/>
    </button>
    <div class="sheet-modal__body" id="item-modal-body"></div>
  </dialog>

  <footer class="app-footer" th:unless="${seated}">
    <div class="container">
      <p class="mb-0" th:text="${shop.shopName}">米粉と鉄板</p>
      <p class="mb-0">お会計はご退店時にレジまでお願いします</p>
      <p class="mb-0 tiny">20歳未満の方への酒類のご提供はできません</p>
    </div>
  </footer>

</div>

<!--/*
  お客さん向けの JavaScript は、ここ（レイアウト）で 1 回だけ読み込む。

  もとは商品詳細と伝票の 2 画面だけが個別に読み込んでいた。
  そのため「人数を決める」「注文を確定する」という<b>いちばん待たされる操作</b>に
  何のふるまいも付いていなかった。

  公開デモは 1 リクエストにおよそ 1 秒かかる（無料枠の CPU）。
  押しても画面が変わらない 1 秒は、待ち時間ではなく<b>故障</b>に見える。
  実際「反応が無くて固まる」と言われたのはこの画面だった。

  読み込む場所を各ページからレイアウトへ移すことで、
  「新しい画面を足したら、そこだけ反応が無い」も起こらなくなる。
*/-->
<script th:src="@{/js/customer.js}" defer></script>
</body>
</html>
