<!DOCTYPE html>
<!--/*
  ============================================================================
   店側（厨房・ホール・管理）画面の共通レイアウト — サイドバー方式
  ============================================================================
   2026-08-18 に横タブ方式から作り替えた。
   トンマナは SnowUI（Figma Community の Dashboard UI Kit）を参考にしている：
   白基調・黒の透過階調・角丸大きめ・Phosphor duotone アイコン。
   スタイルの実体は app.css の「.theme-snow」ブロック（下の body のクラスと同じ名前）。

   ── ナビの分類（大カテゴリ＝権限の境界に一致させている） ──
     営業中につかう   … STAFF でも見える（厨房・ホール・品切れ）
     それ以外の 4 群  … ADMIN のみ（sec:authorize で丸ごと隠す）
     ログアウト       … カテゴリではなくアカウント操作なので左下に固定

   ── 現在地の判定 ──
   どの項目を光らせるかは URL（${currentPath}）から判定する。
   コントローラごとに目印を渡す方式だと、画面を増やすたびに
   「目印の渡し忘れ」が起きるため、URL という嘘をつけない情報源に寄せた。
   （currentPath は GlobalModelAttributes が全画面に自動で渡している）
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title th:text="${pageTitle} + ' | ' + ${shop.shopName} + ' 店舗管理'">店舗管理</title>
  <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!--/* theme-desk … 店側の画面の寸法とトンマナ（app.css の 30 節）。
       文字を大きくし、余白を広げ、表の見出しを緑でベタ塗りにする。

       ★ はじめ /admin と /inventory だけに付けていましたが、
         厨房ボード・ホール・品切れ・残数だけ古い見た目で取り残され、
         同じサイドバーの中で 2 種類の画面が混ざっていました。
         店側は全部そろえます。

         厨房ボードは 1 画面に入る注文の数が減ります。
         それでも「画面ごとに別物」に見えるほうが実害が大きいと判断しました。
         現場で足りなくなったら、.staff-shell--floor 側だけ
         余白を戻す形（app.css 30-2）で調整してください。

       お客さんの注文画面（layout/customer）には付けません。 */-->
<body class="theme-snow theme-desk">
<!--/* staff-shell--floor … サイドバーをアイコンだけの帯に畳む合図（app.css の「サイドバーシェル」）。

       対象は営業中に立って使う画面（厨房ボード・ホール・会計・品切れ・残数）。
       もとは画面幅 960px 以下という条件で畳んでいましたが、
       厨房・ホールのタブレットは 1024px あるため一度も畳まれていませんでした。
       幅ではなく「どの画面か」で判断します。

       currentPath は null になり得ます。#strings.startsWith(null, …) は例外になるので、
       この形（先に null を確かめる）で書いてください。下の見学モードの判定と同じ書き方です。 */-->
<!--/* ============ 上の帯（ヘッダー） ============ 2026-09-04 に追加

      営業中に「いま店がどうなっているか」を、画面を移らずに確かめられるようにする帯。
      出すのは 3 つだけ ― 受付の状態・未提供の件数・営業日。
      どれも「顔を上げた 1 秒で読めること」が仕事なので、それ以外は右端に小さく置く。

      ★ 未提供の件数はボタンにしてある
        件数を見て「多いな」と思ったとき、次にやりたいのは厨房ボードを開くこと。
        数字と行き先が離れていると、サイドバーを探す一手間が毎回挟まる。
        0 件のときは出さない。「0」と書いてあるより、無いほうが速く読める。

      値は StaffHeaderModelAttributes が配っている（店側のパッケージだけに効く）。
      お客さま側で無駄なクエリを増やさないための線引きなので、
      ここで使う値を増やすときは、あちらの適用範囲も一緒に確かめること。 */-->
<!--/* ★ 画面ごとにサイドバーを畳むのはやめた（2026-09-05）★

       もとは厨房ボード・ホール・品切れ・残数のときだけ、
       サイドバーを 64px のアイコンだけの帯に畳んでいた
       （「営業中は立って使うので、文字より面積」という判断）。

       だが設計（Figma）に畳んだ姿は無く、全画面 264px で描いてある。
       実際に使うと、サイドバーから厨房ボードへ移った瞬間に
       ナビが別物に変わるので、いまどこにいるのか読み直すことになる。
       行き先の名前が消えるのも、慣れていない人には戻れない作りだった。

       狭い画面（960px 以下）で畳むのは残してある。そちらは
       「幅が足りない」という物理的な理由なので、画面ごとの判断とは別。 */-->
<div class="staff-frame" th:with="p=${currentPath} ?: ''">

  <header class="topbar">

    <div class="topbar__brand">
      <img class="topbar__logo" th:src="@{/images/logo.jpg}" alt="" aria-hidden="true">
      <span class="topbar__brand-text">
        <span class="topbar__brand-name" th:text="${shop.shopName}">米粉と鉄板</span>
        <span class="topbar__brand-sub">店舗管理</span>
      </span>
      <span class="topbar__brand-caret" aria-hidden="true">⌄</span>
    </div>

    <!--/* 受付の状態。判定は headerAccepting（営業時間とラストオーダーまで見た結果）。
           shop.acceptingOrders は店長が倒した非常ブレーキだけなので使わない。 */-->
    <!--/* ★ 式の中に BEM の __ を書かないこと。
           Thymeleaf は __...__ を前処理の記号として読むので、
           'topbar__state--on' と書くと「__state--on' : 'topbar__」を
           式として解釈しようとして、店側の全画面がテンプレート解析エラーになる。
           修飾は is- 接頭辞（is-active / is-error と同じ流儀）で書く。 */-->
    <span class="topbar__state" th:if="${headerAccepting != null}"
          th:classappend="${headerAccepting} ? 'is-on' : 'is-off'">
      <span class="topbar__dot" aria-hidden="true"></span>
      <span th:text="${headerAccepting} ? '注文を受付中' : '注文を停止中'">注文を受付中</span>
    </span>

    <a class="topbar__pending" th:if="${headerPendingCount != null and headerPendingCount > 0}"
       th:href="@{/kitchen}">
      <th:block th:replace="~{fragments/icons :: ic_cooking_pot}"/>
      <span class="topbar__pending-label">未提供</span>
      <span class="topbar__pending-count" th:text="${headerPendingCount}">3</span>
      <span class="topbar__pending-unit">件</span>
      <span class="topbar__pending-go" aria-hidden="true">›</span>
    </a>

    <span class="topbar__spacer"></span>

    <span class="topbar__day" th:if="${headerBusinessDate != null}">
      <span class="topbar__day-label">営業日</span>
      <span class="topbar__day-value"
            th:text="${#temporals.format(headerBusinessDate, 'yyyy-MM-dd')}">2026-09-04</span>
    </span>

    <span class="topbar__divider" aria-hidden="true"></span>

    <a class="topbar__help" th:href="@{/admin/settings}" title="店舗設定">
      <span aria-hidden="true">?</span><span class="visually-hidden">店舗設定</span>
    </a>

    <span class="topbar__avatar" aria-hidden="true"
          th:with="pr=${#authentication != null} ? ${#authentication.principal} : null"
          th:text="${pr instanceof T(jp.komeko.order.security.StaffUserDetails)} ? ${#strings.substring(pr.displayName, 0, 1)} : '店'">店</span>
  </header>

<div class="staff-shell">

  <!--/* ============ サイドバー ============ */-->
  <aside class="sb">

    <!--/*
      ダッシュボード（大カテゴリの外）。
      店長は常に、ゲスト（公開デモの見学者）も見られます。

      ★ ここを sec:authorize="hasRole('ADMIN')" だけにしていて、
        ゲストにリンクが出ていませんでした。画面自体は開けるのに入口が無い、
        という状態で「全体像が分からない」と言われる原因になります。
        アクセス許可（SecurityConfig）と入口（このリンク）は必ず対で直すこと。
    */-->
    <nav class="sb__nav" aria-label="店舗管理メニュー">

      <a th:if="${guestLogin} or ${#authorization.expression('hasRole(''ADMIN'')')}"
         class="sb__item" th:href="@{/admin}"
         th:classappend="${p == '/admin'} ? 'is-active'">
        <th:block th:replace="~{fragments/icons :: ic_chart_pie_slice}"/><span>ダッシュボード</span>
      </a>

      <!--/* ── 営業中につかう（STAFF も見える唯一のグループ） ── */-->
      <p class="sb__label">営業中につかう</p>
      <a class="sb__item" th:href="@{/kitchen}"
         th:classappend="${#strings.startsWith(p, '/kitchen') and !#strings.startsWith(p, '/kitchen/stock')} ? 'is-active'">
        <th:block th:replace="~{fragments/icons :: ic_cooking_pot}"/><span>厨房ボード</span>
      </a>
      <a class="sb__item" th:href="@{/hall}"
         th:classappend="${#strings.startsWith(p, '/hall')} ? 'is-active'">
        <th:block th:replace="~{fragments/icons :: ic_receipt}"/><span>ホール・会計</span>
      </a>
      <a class="sb__item" th:href="@{/kitchen/stock}"
         th:classappend="${#strings.startsWith(p, '/kitchen/stock')} ? 'is-active'">
        <th:block th:replace="~{fragments/icons :: ic_package}"/><span>品切れ・残数</span>
      </a>

      <!--/* ── 原価と仕入れ ── 2026-09-05 に見出しを足した

             この 3 つには見出しが無く、上の「営業中につかう」に吸われていた。
             サイドバーが「厨房ボード〜レシピ・原価表」までひと続きに見え、
             設計（Figma）の「厨房〜品切れ」で切れる形と食い違っていた。

             見出しの有無は、ただの飾りではなく<b>どこまでが同じ仲間か</b>を決める。
             営業中に立って使うもの（厨房・ホール・品切れ）と、
             机で座って入力するもの（仕入れ・食材・レシピ）は、
             使う時間も場所も違う。混ざっていると、
             営業中にレシピ画面を開いてしまう導線になる。

             app.inventory.enabled=false のときはコントローラが存在せず 404 になるので、
             設定で切っている間はリンクも出さない。
             ★ 見出しにも同じ条件を付けること。
               付け忘れると、在庫を切ったときに「原価と仕入れ」だけが
               中身の無い見出しとして残る。 */-->
      <p class="sb__label" th:if="${inventoryEnabled}">原価と仕入れ</p>

      <!--/* （${inventoryEnabled} は
             InventoryModelAttributes が全画面に渡している）。 */-->
      <a th:if="${inventoryEnabled}" class="sb__item" th:href="@{/inventory/purchases}"
         th:classappend="${#strings.startsWith(p, '/inventory/purchases')} ? 'is-active'">
        <th:block th:replace="~{fragments/icons :: ic_receipt}"/><span>仕入れ・経費</span>
      </a>
      <a th:if="${inventoryEnabled}" class="sb__item" th:href="@{/inventory/ingredients}"
         th:classappend="${#strings.startsWith(p, '/inventory/ingredients')} ? 'is-active'">
        <th:block th:replace="~{fragments/icons :: ic_package}"/><span>食材・在庫</span>
      </a>
      <a th:if="${inventoryEnabled}" class="sb__item" th:href="@{/inventory/recipes}"
         th:classappend="${#strings.startsWith(p, '/inventory/recipes')} ? 'is-active'">
        <th:block th:replace="~{fragments/icons :: ic_notebook}"/><span>レシピ・原価表</span>
      </a>

      <!--/* ── ここから下は店長（ADMIN）のみ ── */-->
      <th:block sec:authorize="hasRole('ADMIN')">

        <p class="sb__label">メニュー管理</p>
        <a class="sb__item" th:href="@{/admin/items}"
           th:classappend="${#strings.startsWith(p, '/admin/items') or #strings.startsWith(p, '/admin/options') or #strings.startsWith(p, '/admin/choices')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_fork_knife}"/><span>商品</span>
        </a>
        <a class="sb__item" th:href="@{/admin/categories}"
           th:classappend="${#strings.startsWith(p, '/admin/categories')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_squares_four}"/><span>カテゴリ</span>
        </a>

        <p class="sb__label">店舗</p>
        <a class="sb__item" th:href="@{/admin/tables}"
           th:classappend="${#strings.startsWith(p, '/admin/tables')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_armchair}"/><span>卓</span>
        </a>
        <a class="sb__item" th:href="@{/admin/qr}"
           th:classappend="${#strings.startsWith(p, '/admin/qr')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_qr_code}"/><span>QRコード</span>
        </a>
        <a class="sb__item" th:href="@{/admin/settings}"
           th:classappend="${#strings.startsWith(p, '/admin/settings')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_gear_six}"/><span>店舗設定</span>
        </a>
        <a class="sb__item" th:href="@{/admin/staff}"
           th:classappend="${#strings.startsWith(p, '/admin/staff')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_users_three}"/><span>スタッフ</span>
        </a>

        <p class="sb__label">記録・分析</p>
        <a class="sb__item" th:href="@{/admin/sales}"
           th:classappend="${#strings.startsWith(p, '/admin/sales')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_chart_line_up}"/><span>売上</span>
        </a>
        <a class="sb__item" th:href="@{/admin/orders}"
           th:classappend="${#strings.startsWith(p, '/admin/orders')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_clock_counter_clockwise}"/><span>注文履歴</span>
        </a>
        <!--/*
          税理士の画面への入口。

          ★ 画面を作っただけでは誰も辿り着けません。
            /accountant は独立したレイアウトで、こちら側のサイドバーに
            項目が無かったため、URL を直接打つ以外に行く方法がありませんでした。
            向こうには「店舗管理へ戻る」があるのに、行きが無かった。

          店長は ACCOUNTANT ではなく ADMIN ですが、SecurityConfig で
          両方に開けてあるので押せます（自分の帳簿を見られないのは不自然なため）。
        */-->
        <a class="sb__item" th:href="@{/accountant}"
           th:classappend="${#strings.startsWith(p, '/accountant')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_notebook}"/><span>税理士の画面</span>
        </a>

        <p class="sb__label">システム</p>
        <a class="sb__item" th:href="@{/admin/backups}"
           th:classappend="${#strings.startsWith(p, '/admin/backups')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_database}"/><span>バックアップ</span>
        </a>

      </th:block>

      <!--/*
        ── 公開デモのときだけ、ゲスト（STAFF）にも見える項目 ──

        卓と QR コードが見えないと「どうやって注文が始まるのか」が分からず、
        システムの全体像が伝わりません。売上と注文履歴も、
        データが架空のデモでは見せる価値のほうが大きい。

        ★ 見えるだけで、書き換えはできません
          （SecurityConfig で GET だけ開けている。POST は ADMIN 限定のまま）。

        ADMIN は上のブロックですでに全部見えているので、ここは STAFF のときだけ。
        両方に出すと、店長の画面で同じ項目が二重に並びます。
      */-->
      <th:block th:if="${guestLogin}" sec:authorize="!hasRole('ADMIN')">

        <p class="sb__label">見学できる画面</p>
        <a class="sb__item" th:href="@{/admin/items}"
           th:classappend="${#strings.startsWith(p, '/admin/items') or #strings.startsWith(p, '/admin/options') or #strings.startsWith(p, '/admin/choices')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_fork_knife}"/><span>商品</span>
        </a>
        <a class="sb__item" th:href="@{/admin/categories}"
           th:classappend="${#strings.startsWith(p, '/admin/categories')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_squares_four}"/><span>カテゴリ</span>
        </a>
        <a class="sb__item" th:href="@{/admin/tables}"
           th:classappend="${#strings.startsWith(p, '/admin/tables')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_armchair}"/><span>卓</span>
        </a>
        <a class="sb__item" th:href="@{/admin/qr}"
           th:classappend="${#strings.startsWith(p, '/admin/qr')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_qr_code}"/><span>QRコード</span>
        </a>
        <a class="sb__item" th:href="@{/admin/settings}"
           th:classappend="${#strings.startsWith(p, '/admin/settings')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_gear_six}"/><span>店舗設定</span>
        </a>
        <a class="sb__item" th:href="@{/admin/staff}"
           th:classappend="${#strings.startsWith(p, '/admin/staff')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_users_three}"/><span>スタッフ</span>
        </a>
        <a class="sb__item" th:href="@{/admin/sales}"
           th:classappend="${#strings.startsWith(p, '/admin/sales')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_chart_line_up}"/><span>売上</span>
        </a>
        <a class="sb__item" th:href="@{/admin/orders}"
           th:classappend="${#strings.startsWith(p, '/admin/orders')} ? 'is-active'">
          <th:block th:replace="~{fragments/icons :: ic_clock_counter_clockwise}"/><span>注文履歴</span>
        </a>

        <!--/* バックアップ（/admin/backups）はここに出しません。
               SecurityConfig で GET も閉じてあるので、
               リンクを出すと押した先が 403 になります。
               入口と許可は必ず一致させること。 */-->

      </th:block>
    </nav>

    <!--/* ============ アカウント欄（左下固定・カテゴリの外） ============
          ログイン中のユーザー表示。テストでは @WithMockUser（displayName を
          持たない素の User）が入るため、instanceof で型を確かめてから
          displayName を読む。確かめずに読むとテストと本番で挙動が割れる。 */-->
    <div class="sb__account"
         th:with="pr=${#authentication != null} ? ${#authentication.principal} : null">
      <span class="sb__avatar" aria-hidden="true"
            th:text="${pr instanceof T(jp.komeko.order.security.StaffUserDetails)} ? ${#strings.substring(pr.displayName, 0, 1)} : '店'">店</span>
      <span class="sb__account-text">
        <span class="sb__account-name"
              th:text="${pr instanceof T(jp.komeko.order.security.StaffUserDetails)} ? ${pr.displayName} : (${#authentication != null} ? ${#authentication.name} : '')">店長</span>
        <span class="sb__account-role">
          <th:block sec:authorize="hasRole('ADMIN')">管理者</th:block>
          <th:block sec:authorize="!hasRole('ADMIN')">スタッフ</th:block>
        </span>
      </span>
      <form th:action="@{/logout}" method="post" class="sb__logout-form">
        <button type="submit" class="sb__logout" title="ログアウト">
          <th:block th:replace="~{fragments/icons :: ic_sign_out}"/><span class="visually-hidden">ログアウト</span>
        </button>
      </form>
    </div>

  </aside>

  <!--/* ============ コンテンツ ============
        各ページの <main> がこの div の中に差し込まれる。
        外側を <main> にすると main が二重になる（HTML として不正）ので div。 */-->
  <div class="staff-main">

    <!--/* ============ 見学モードの帯 ============

          公開デモのゲストが管理画面を開いたときだけ出す。

          ★ なぜ帯と無効化の両方が要るのか
            SecurityConfig は POST を弾くので、押されても書き換わりません。
            つまり「安全」ではある。けれど押せてしまうと、押した人は
            エラー画面に飛ばされて「壊れている」と受け取ります。
            守ることと、伝えることは別の仕事です。

          ★ 品切れ・残数（/kitchen/stock）も対象に含める
            この画面は /kitchen 配下にありますが、性質は管理画面です。
            全品を品切れにされると、次に見に来た人が何も注文できなくなります。

            同じ「書き込み」でも、
              注文の状態（焼きはじめ／焼き上がり）… その場限り。次の人に残らない
              品切れ・残数                        … 残る。後から来る人の画面を壊す
            が分かれます。パスの形ではなく、影響の残り方で線を引きます。

          ★ 条件を「管理画面のときだけ」に絞っている理由
            厨房ボードの「焼きはじめ／焼き上がり」は、ゲストにも押してもらう前提です。
            注文の状態を進めると客側の画面がその場で変わる、というのが
            このデモのいちばんの見せ場なので、そこを無効化しては本末転倒。

            一方、ホール（会計）の書き込みと注文キャンセルは 2026-08-22 に
            ゲストから閉じました（SecurityConfig 参照）。公開している説明は
            「表示のみ・厨房ボードで状態を進める操作だけ」であり、押せてしまうのは
            約束違反ですし、見学用の卓の伝票を締められると次の見学者の /demo が
            壊れた状態から始まります。各画面の該当ボタンも
            sec:authorize="!hasRole('GUEST')" で隠してあります。 */-->
    <div th:if="${guestLogin and currentPath != null
                  and (#strings.startsWith(currentPath, '/admin')
                       or #strings.startsWith(currentPath, '/kitchen/stock')
                       or #strings.startsWith(currentPath, '/inventory'))}"
         sec:authorize="!hasRole('ADMIN')"
         class="viewer-note" role="status">
      <strong>見学モードです。</strong>
      画面は本来の形で見られますが、保存・削除はできません。
    </div>

    <div th:replace="${content}">ページ本文</div>
  </div>

</div>
</div>

<!--/* 見学モードのとき、本文の中の「送信」だけを押せなくする。

      入力欄は触れるままにしてあります。何が設定できる画面なのかは
      入力欄の中身を見て分かるものなので、そこまで殺すと画面が死にます。
      止めたいのは「押したらエラーになる」という体験だけ。

      サイドバーのログアウトは .staff-main の外にあるので巻き込みません。
      ここを body 全体にすると、見学者がログアウトできなくなります。

      ★ 条件に p ではなく currentPath を使う理由
        p は上の div の th:with で定義した変数で、
        その div を閉じたあとのここからは見えません（null になります）。
        最初 p のまま書いていて、#strings.startsWith(null, …) で
        全画面がテンプレート解析エラーになりました。
        変数のスコープは、閉じタグの外まで持ち越せません。 */-->
<!--/* ★ 在庫モジュール（/inventory）も対象に含めること。
      2026-08-31 のUI監査で、ここに /inventory が無いせいで
      ゲストに帯も出ず送信ボタンも生きたままになり、押すと 403 の
      エラーページに飛ばされる（＝上のコメントで警戒しているとおりの事故）
      ことが見つかった。スタッフゾーンに接頭辞を増やしたら、
      StaffZoneIpFilter と同じく、ここにも足す。 */-->
<script th:if="${guestLogin and currentPath != null
                 and (#strings.startsWith(currentPath, '/admin')
                      or #strings.startsWith(currentPath, '/kitchen/stock')
                      or #strings.startsWith(currentPath, '/inventory'))}"
        sec:authorize="!hasRole('ADMIN')">
  document.addEventListener('DOMContentLoaded', function () {
    var main = document.querySelector('.staff-main');
    if (!main) return;
    main.querySelectorAll('button[type="submit"], input[type="submit"], button:not([type])')
        .forEach(function (el) {
          el.disabled = true;
          el.title = '見学モードでは変更できません';
        });
  });
</script>
</body>
</html>
