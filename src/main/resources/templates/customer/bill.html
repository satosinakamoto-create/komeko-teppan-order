<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout('お席の伝票', ~{::main})}">
<body>
<main>
  <!--/* 伝票だけ左右の余白が 24px（設計 暗04 は本文が 342px 幅）。
         メニュー側の 16px より広いのは、金額を読む画面だから。
         行が短くなるぶん、品名と金額の距離が縮んで目が迷わない。 */-->
  <div class="container bill-page">

    <div th:replace="~{fragments/common :: flash}"></div>

    <div class="section-title">
      <h1 class="section-title__text">お席の伝票</h1>
      <span class="section-title__count"
            th:text="${bill.diningTable.name} + ' ／ ' + ${bill.guestCount} + '名'">3番テーブル ／ 4名</span>
    </div>

    <!--/* ===== 明細 ===== 設計: 暗04 伝票・会計

      設計は「頼んだ品」と「テーブルチャージ」を<b>同じ形の行</b>で並べている。
      注文ごとのカードに分けず、1 本の伝票として上から読ませる形。
      レジで受け取る紙の伝票と同じ読み方になる。

      ★ 状態（焼いています／お渡し済み）は行の中に入れてある。
        設計の伝票には状態が描かれていないが、そこを落とすと
        「頼んだのに来ない」ときにお客さまが確かめる手段が無くなる。
        別の一覧をもう 1 つ作ると同じ品が 2 回並ぶので、行の中に置いた。

      data-* 属性は JavaScript が読むための値置き場。
      customer.js がここを見て数秒ごとに状態を確認します。
    */-->
    <section id="bill-status" th:attr="data-pending=${bill.hasPendingOrders()}">

      <div th:if="${orders.isEmpty()}">
        <div th:replace="~{fragments/common :: empty('膳', 'まだご注文がありません')}"></div>
      </div>

      <div class="mt-6" th:unless="${orders.isEmpty()}">
        <th:block th:each="order : ${orders}">
          <div class="bill-row" th:each="line : ${order.lines}">
            <span class="bill-row__name">
              <span th:text="${line.menuItemName}">肉玉米粉そば</span>
              <span th:text="' ×' + ${line.quantity}"> ×2</span>
              <span class="bill-row__note" th:if="${!line.options.isEmpty()}"
                    th:text="${line.optionSummary}">ソース / ねぎマヨ</span>
              <span class="bill-row__state" th:if="${order.status.name != 'COMPLETED'}"
                    th:style="'color:' + ${order.status.color}"
                    th:text="${order.status.customerLabel}">焼いています</span>
            </span>
            <span class="bill-row__amount"
                  th:text="'¥' + ${#numbers.formatInteger(line.lineTotal, 1, 'COMMA')}">¥2,360</span>
          </div>
        </th:block>

        <!--/* 品の合計と席の料金。設計では品の行と同じ形で続く */-->
        <div class="bill-row">
          <span class="bill-row__name">お料理・お飲み物</span>
          <span class="bill-row__amount"
                th:text="'¥' + ${#numbers.formatInteger(bill.subtotalAmount, 1, 'COMMA')}">¥4,200</span>
        </div>
        <div class="bill-row" th:if="${bill.tableChargeAmount > 0}">
          <span class="bill-row__name"
                th:text="'テーブルチャージ （¥' + ${#numbers.formatInteger(bill.tableChargePerGuest, 1, 'COMMA')}
                         + ' × ' + ${bill.guestCount} + '名）'">テーブルチャージ （¥450 × 2名）</span>
          <span class="bill-row__amount"
                th:text="'¥' + ${#numbers.formatInteger(bill.tableChargeAmount, 1, 'COMMA')}">¥900</span>
        </div>
        <div class="bill-row" th:if="${bill.lateNightApplied}">
          <span class="bill-row__name"
                th:text="'深夜料金（' + ${bill.lateNightSurchargePercent} + '%）'">深夜料金（10%）</span>
          <span class="bill-row__amount"
                th:text="'¥' + ${#numbers.formatInteger(bill.lateNightAmount, 1, 'COMMA')}">¥1,004</span>
        </div>
      </div>

      <!--/* 合計。ここだけ 20px の太字ときつね色（暗/合計行 342x60） */-->
      <div class="bill-total">
        <span class="bill-total__label">合計</span>
        <span class="bill-total__amount"
              th:text="'¥' + ${#numbers.formatInteger(bill.totalAmount, 1, 'COMMA')}">¥5,100</span>
      </div>

      <!--/*
        深夜料金は「注文した時刻」で決まります（会計時刻でも着席時刻でもありません）。
        22:50 のお客さまが 23:00 を過ぎてから追加注文すると、
        その注文にだけ割増がかかります。頼む前に知らせておく必要があるので、
        まだ割増がかかっていないうちから出しています。
        先に書いてあれば案内、黙っていて後から増えればクレームです。

        「お会計には」と書くと、22:00 に頼んだ品にもかかると誤解されます。
        開始時刻だけを書くと、終了時刻を設定している店で
        「それ以降ずっと」と誤解されます。だから「範囲」と「ご注文」の両方を書きます。
      */-->
      <p class="bill-note">
        <span th:text="'（内 消費税 ' + ${bill.taxRatePercent} + '% ¥'
                       + ${#numbers.formatInteger(bill.taxAmount, 1, 'COMMA')} + '）'">（内 消費税 10% ¥463）</span>
        <span th:if="${shop.lateNightSurchargePercent > 0}"
              th:text="'　' + ${shop.lateNightStartTime} + '〜' + ${shop.lateNightEndTime}
                       + ' のご注文には深夜料金 ' + ${shop.lateNightSurchargePercent} + '% を頂戴いたします'">
          　23:00〜05:00 のご注文には深夜料金 10% を頂戴いたします</span>
      </p>

      <!--/* 焼き始める前だけ、お客さま自身でキャンセルできる。
             設計には無いが、押せなくなると「頼み間違いを直せない」になる */-->
      <th:block th:each="order : ${orders}">
        <form th:if="${order.customerCancelable}" class="mt-4"
              th:action="@{/bill/orders/{t}/cancel(t=${order.publicToken})}" method="post">
          <button type="submit" class="btn btn--sm btn--danger"
                  onclick="return confirm('このご注文をキャンセルします。よろしいですか？');"
                  th:text="'ご注文 #' + ${order.orderNumber} + ' をキャンセル'">
            ご注文 #101 をキャンセル
          </button>
        </form>
      </th:block>
    </section>

    <!--/* ===== お会計をお願いする ===== 設計 暗04 の主要ボタン

           押すとホール画面に「お会計をご希望です」と出る。
           サービスの画面（暗03）の呼び出しと同じ仕組みで、
           ¥0 の注文にはしていない。金額も個数も無いものを注文に混ぜると、
           売上と客単価の意味が濁るため（ServiceCallType のコメント）。

           from=bill を付けて、押した人をサービスの画面へ飛ばさずここへ戻す。 */-->
    <form th:action="@{/service/call/CHECKOUT(from='bill')}" method="post" class="mt-6">
      <button type="submit" class="btn btn--primary btn--lg btn--block"
              onclick="return confirm('お会計をお願いする。よろしいですか？');">お会計をお願いする</button>
    </form>

    <a class="btn btn--ghost btn--lg btn--block mt-4" th:href="@{/}">追加でご注文する</a>

    <p class="tiny faint center mt-6">
      画面は自動で更新されます。お会計はご退店時にレジまでお願いします。
    </p>

  </div>

  <!--/* customer.js はレイアウト（layout/customer.html）で読み込む。
         ここにも書くと 2 回読み込まれ、数秒ごとの状態確認が二重に走る。 */-->
</main>
</body>
</html>
