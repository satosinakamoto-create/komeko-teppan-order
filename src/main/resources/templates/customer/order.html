<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout('ご注文番号 ' + ${order.orderNumber}, ~{::main})}">
<body>
<main>
  <div class="container">

    <div th:replace="~{fragments/common :: flash}"></div>

    <!--/* ===== 注文番号（この画面の主役） =====
           data-* 属性は JavaScript が読むための値置き場。
           customer.js がここを見て 5 秒ごとに状態を確認します。
    */-->
    <section id="order-status" class="receipt mt-4"
             th:classappend="${order.status.name() == 'READY'} ? 'is-ready'"
             th:attr="data-token=${order.publicToken}, data-status=${order.status.name()}">

      <p class="receipt__label">ご注文番号</p>
      <p class="order-number" th:text="${order.orderNumber}">101</p>

      <p class="receipt__label mb-0" th:if="${order.customerName}"
         th:text="${order.customerName} + ' 様'">やまだ 様</p>

      <div class="receipt__status">
        <span class="status-chip"
              th:style="'color:' + ${order.status.color}"
              th:text="${order.status.customerLabel}">焼いています</span>
      </div>

      <!--/* 待ち状況（キャンセル・受渡済のときは出さない） */-->
      <p class="receipt__wait" th:unless="${order.status.closed}">
        <span th:if="${wait.waitingOrders > 0}">
          あと <b id="ahead-count" th:text="${wait.waitingOrders}">2</b> 組 ／
        </span>
        <span id="wait-label" th:text="${wait.label()}">約 12 分</span>
      </p>

      <p class="receipt__wait bold" th:if="${order.status.name() == 'READY'}">
        カウンターまでお越しください
      </p>

      <!--/* 進捗ステップ */-->
      <ul class="steps" th:unless="${order.status.name() == 'CANCELED'}"
          th:with="currentIndex=${statusOrder.indexOf(order.status)}">
        <li class="steps__item"
            th:each="s, i : ${statusOrder}"
            th:classappend="${i.index < currentIndex} ? 'is-done' : (${i.index == currentIndex} ? 'is-current' : '')">
          <span class="steps__dot"></span>
          <span th:text="${s.staffLabel}">受付</span>
        </li>
      </ul>
    </section>

    <!--/* ===== キャンセル済み ===== */-->
    <div class="alert alert--error mt-6" th:if="${order.status.name() == 'CANCELED'}" role="alert">
      <p class="mb-0">このご注文はキャンセルされました。</p>
      <p class="mb-0 small" th:if="${order.canceledReason}"
         th:text="'理由：' + ${order.canceledReason}">理由：お客様都合</p>
    </div>

    <!--/* ===== お受け取りのご案内 ===== */-->
    <div class="alert alert--info mt-6" th:unless="${order.status.closed}">
      <p class="mb-0" th:text="${shop.pickupNotice}">
        番号をお呼びしましたらカウンターまでお越しください。
      </p>
    </div>

    <!--/* ===== 明細 ===== */-->
    <div class="card mt-6">
      <div class="card__head">ご注文の品</div>
      <div class="card__body">
        <div class="cart-line" th:each="line : ${order.lines}">
          <div>
            <div class="cart-line__name">
              <span th:text="${line.menuItemName}">コンプレット</span>
              <span class="muted" th:text="' × ' + ${line.quantity}"> × 2</span>
            </div>
            <div class="cart-line__opts" th:if="${!line.options.isEmpty()}"
                 th:text="${line.optionSummary}">チーズ増量</div>
          </div>
          <div class="cart-line__price"
               th:text="'¥' + ${#numbers.formatInteger(line.lineTotal, 1, 'COMMA')}">¥1,760</div>
        </div>

        <p class="small muted mt-4" th:if="${order.note}"
           th:text="'ご要望：' + ${order.note}">ご要望：ソース少なめ</p>
      </div>

      <div class="card__foot">
        <table class="total-table">
          <tbody>
          <tr>
            <td class="muted" th:text="'内 消費税（' + ${order.taxRatePercent} + '%）'">内 消費税（8%）</td>
            <td th:text="'¥' + ${#numbers.formatInteger(order.taxAmount, 1, 'COMMA')}">¥188</td>
          </tr>
          <tr class="is-grand">
            <td>お支払い金額</td>
            <td th:text="'¥' + ${#numbers.formatInteger(order.totalAmount, 1, 'COMMA')}">¥2,540</td>
          </tr>
          </tbody>
        </table>
        <p class="tiny faint mb-0 mt-4">お会計はお受け取り時に店頭でお願いします。</p>
      </div>
    </div>

    <!--/* ===== 操作 ===== */-->
    <div class="stack mt-6">
      <form th:if="${order.customerCancelable}" th:action="@{/o/{t}/cancel(t=${order.publicToken})}" method="post">
        <button type="submit" class="btn btn--danger btn--block"
                onclick="return confirm('ご注文をキャンセルします。よろしいですか？');">
          注文をキャンセルする
        </button>
      </form>

      <a class="btn btn--block" th:href="@{/}">メニューに戻る</a>
    </div>

    <p class="tiny faint center mt-6">
      このページをブックマークすると、あとから状況を確認できます。
    </p>

  </div>

  <script th:src="@{/js/customer.js}" defer></script>
</main>
</body>
</html>
