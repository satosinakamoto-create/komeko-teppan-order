<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout('メニュー', ~{::main})}">
<body>
<main>

  <!--/*
    ===== 大カテゴリのタブ =====
    画面に固定され、スクロールしても動きません（CSS の position: fixed）。
    いつでも他のジャンルへ移れます。

    中身は <button> です。<a href="#..."> にすると押した瞬間に
    URL が変わって「戻る」の履歴が増え、戻るボタンの挙動が分かりにくくなります。
    ここは画面内の移動なので、履歴を汚さないボタンにしています。

    tabs-slot は「タブが本来いた場所」を空けておくための箱です。
    中のタブは fixed で流れから外れるため、
    この箱が高さを持っていないと、下のメニューがタブの裏に潜り込みます。

    ★ この塊は、お知らせ（flash）より前に置くこと。
      あとに置くと、お知らせが画面のいちばん上に来てしまい、
      同じ位置に固定されているタブの裏に隠れて読めなくなります。
  */-->
  <div class="tabs-slot" th:if="${!tabs.isEmpty()}">
    <nav class="tabs" aria-label="メニューのジャンル" id="menuTabs" role="tablist">
      <button type="button" class="tab" th:each="tab, ts : ${tabs}"
              role="tab"
              th:classappend="${ts.first} ? 'is-active'"
              th:attr="aria-selected=${ts.first} ? 'true' : 'false',
                       aria-controls='panel-' + ${ts.index},
                       data-index=${ts.index}"
              th:id="'tab-' + ${ts.index}"
              th:text="${tab.key}">お好み焼き</button>
    </nav>
  </div>

  <!--/* お知らせはタブの下に置く（上に置くと固定タブの裏に隠れて読めない） */-->
  <div class="container">
    <div th:replace="~{fragments/common :: flash}"></div>

    <!--/* 受付停止中・時間外のお知らせ */-->
    <div class="alert alert--warn mt-4" th:unless="${accepting}" role="alert">
      <p class="mb-0" th:text="${rejectReason}">ただいま受付を停止しております</p>
    </div>
  </div>

  <!--/*
    th:if と th:replace を同じタグに書くと th:replace が先に評価されてしまい、
    条件が効きません（Thymeleaf の属性の優先順位）。外側のタグで条件を判定します。
  */-->
  <div class="container" th:if="${tabs.isEmpty()}">
    <div th:replace="~{fragments/common :: empty('米', 'メニューを準備中です')}"></div>
  </div>

  <!--/*
    ===== ジャンルごとの面（パネル）=====
    横に並べた面を、左右のスワイプで切り替えます。

    これは JavaScript のスワイプ判定ではなく、ブラウザの
    「横スクロール ＋ scroll-snap」でやっています。指を離した位置に
    いちばん近い面へ自動で吸い付くので、慣性もはたらいて自然に動きます。
    JS は「いまどの面にいるか」をタブに反映するのと、
    タブを押されたときにそこへ寄せるためだけに使います。
  */-->
  <div class="pager" id="menuPager" th:if="${!tabs.isEmpty()}">
    <section class="pager__panel" th:each="tab, ts : ${tabs}"
             role="tabpanel"
             th:id="'panel-' + ${ts.index}"
             th:attr="aria-labelledby='tab-' + ${ts.index}">
      <div class="container">

        <!--/*
          ===== 1 カテゴリぶんの並べ方 =====

          設計（暗01 お好み焼き／暗02 ビール・サワー）は、
          お食事とドリンクで見せ方そのものを変えている。

            お食事   1 品目は大きな写真カード、2 品目からは 2 列に並べて下へ流す
            ドリンク 1 行ずつの一覧。写真があるときは行の中に小さく置く（72px）

          料理は絵で選び、飲み物は名前で選ぶ。実際そうやって注文している。
          写真の有無で切り替えるのではなく大分類で切り替えるのは、
          暗02 の「オールフリー」が写真を持ちながら行として描かれているから。
          飲み物の写真は、選ぶ手がかりであって主役ではない、という設計の意思。
        */-->
        <div th:each="entry : ${tab.value}" th:id="'cat-' + ${entry.key.id}">

          <!--/* ===== ドリンク：行の一覧 ===== */-->
          <th:block th:if="${drinkSection}">
            <a th:each="item : ${entry.value}"
               class="drink-row"
               th:classappend="${!item.orderable} ? 'is-soldout'"
               th:href="@{/items/{id}(id=${item.id})}">
              <img class="drink-row__img" th:if="${item.imagePath != null}"
                   th:src="@{${item.imagePath}}" th:alt="${item.name}" loading="lazy">
              <span class="drink-row__body">
                <!--/* 札は品名の上（2026-09-06）。写真カード・サムネイルと揃える */-->
                <span th:replace="~{fragments/common :: allergens(${item})}"></span>
                <span class="drink-row__name" th:text="${item.name}">サッポロ赤星（中瓶）</span>
                <span class="drink-row__note" th:if="${item.description}"
                      th:text="${item.description}">お店のおすすめ。</span>
              </span>
              <span class="drink-row__price"
                    th:insert="~{fragments/common :: price(${item})}">¥700</span>
            </a>
          </th:block>

          <!--/* ===== お食事：写真カード ＋ おすすめ帯 ===== */-->
          <th:block th:unless="${drinkSection}"
                    th:with="withPhoto=${#lists.toList(entry.value).?[imagePath != null]},
                             withoutPhoto=${#lists.toList(entry.value).?[imagePath == null]}">

            <!--/* いちばん見せたい 1 品。写真カード（358x276） */-->
            <a th:if="${!withPhoto.isEmpty()}" class="photo-card mt-4"
               th:with="hero=${withPhoto[0]}"
               th:classappend="${!hero.orderable} ? 'is-soldout'"
               th:href="@{/items/{id}(id=${hero.id})}">
              <img class="photo-card__img" th:src="@{${hero.imagePath}}"
                   th:alt="${hero.name}" loading="lazy">
              <!--/* 売り切れ・残数・アレルギーは写真の上に重ねる。
                     名前の帯（66px）に入れると帯が伸びてカードの高さが崩れる */-->
              <span class="photo-card__badges"
                    th:replace="~{fragments/common :: allergens(${hero})}"></span>
              <!--/* 品名と説明で 1 列、価格は右（設計 暗/写真カード の「品名と説明」）。
                     説明が無い品は行ごと出さない。空の行を置くと、
                     説明のある品と無い品でカードの高さが揃っているように見えて、
                     実際には 21px ぶんの空白が入る */-->
              <div class="photo-card__bar">
                <div class="photo-card__text">
                  <h3 class="photo-card__name" th:text="${hero.name}">肉玉米粉そば</h3>
                  <p class="photo-card__note" th:if="${hero.description}"
                     th:text="${hero.description}">定番。豚肉と卵、米粉そば入り。</p>
                </div>
                <span class="photo-card__price"
                      th:insert="~{fragments/common :: price(${hero})}">¥1,180</span>
              </div>
            </a>

            <!--/* 節見出し。丸・見出し・品数の 3 つで 1 行 28px（暗/節見出し） */-->
            <div class="section-title">
              <h2 class="section-title__text" th:text="${entry.key.name}">お好み焼き</h2>
              <span class="section-title__count"
                    th:text="${entry.value.size()} + ' 品'">4 品</span>
            </div>

            <!--/* 2 品目から下は 2 列に並べ、そのまま下へ流す（設計 361:3809）。

                   ★ 2026-09-06 に横スクロールをやめた。
                     指を横に動かさないと 3 品目が見えないので、
                     そこに品があること自体が伝わらない。
                     画面は縦に読むものなので、横に隠すと「これで全部」に見える。 */-->
            <div class="thumb-row" th:if="${withPhoto.size() > 1}">
              <a th:each="item, s : ${withPhoto}" th:if="${!s.first}"
                 class="thumb"
                 th:classappend="${!item.orderable} ? 'is-soldout'"
                 th:href="@{/items/{id}(id=${item.id})}">
                <img class="thumb__img" th:src="@{${item.imagePath}}"
                     th:alt="${item.name}" loading="lazy">
                <!--/* 「おすすめ」などの札は品名の上（2026-09-06）。
                       写真カードは写真に重ねて上に出しているので、そちらと揃う。
                       下に置くと、品名と価格を読んだあとで目に入るので、
                       「おすすめだから見た」ではなく「見たあとにおすすめと知る」になる */-->
                <span th:replace="~{fragments/common :: allergens(${item})}"></span>
                <span class="thumb__name" th:text="${item.name}">ねぎたっぷり米粉そば</span>
                <!--/* 説明は品名と価格のあいだ（設計 暗/サムネイル 373:3999）。
                       価格の下に置くと、金額を見たあとで説明を読む順になる */-->
                <span class="thumb__note" th:if="${item.description}"
                      th:text="${item.description}">青ねぎをたっぷりのせて。</span>
                <span class="thumb__price"
                      th:insert="~{fragments/common :: price(${item})}">¥1,380</span>
              </a>
            </div>

            <!--/* 写真の無い品は、お食事でも行で出す。並べる絵が無いので */-->
            <a th:each="item : ${withoutPhoto}"
               class="drink-row"
               th:classappend="${!item.orderable} ? 'is-soldout'"
               th:href="@{/items/{id}(id=${item.id})}">
              <span class="drink-row__body">
                <!--/* 札は品名の上（2026-09-06）。写真カード・サムネイルと揃える */-->
                <span th:replace="~{fragments/common :: allergens(${item})}"></span>
                <span class="drink-row__name" th:text="${item.name}">本日の特製サラダ</span>
                <span class="drink-row__note" th:if="${item.description}"
                      th:text="${item.description}">お店のおすすめ。</span>
              </span>
              <span class="drink-row__price"
                    th:insert="~{fragments/common :: price(${item})}">¥1,200</span>
            </a>
          </th:block>

        </div>

      </div>
    </section>
  </div>

  <!--/*
    画面下の固定バー（点数・金額・注文リストを見る）は置きません。
    同じことが右上の「注文リスト ②」で分かるうえ、
    下に固定するとメニューが1品ぶん隠れ、
    スマホでは「戻る」の指の通り道とも重なります。
    入口は右上の1つに絞り、そこに未確定の吹き出しを出しています。
  */-->

  <!--/*
    タブと面（パネル）の同期。
    スワイプそのものは CSS がやるので、ここでやるのは 2 つだけです。

      1. 面が切り替わったら、対応するタブに印を付ける
      2. タブが押されたら、その面へ寄せる

    th:inline="none" は「この中の [[...]] を Thymeleaf に触らせない」という指示です。
    JavaScript の配列や比較演算子が Thymeleaf の記法と衝突するのを防ぎます。
  */-->
  <script th:inline="none">
    (function () {
      var pager = document.getElementById('menuPager');
      var tabBar = document.getElementById('menuTabs');
      if (!pager || !tabBar) return;

      var tabs = Array.prototype.slice.call(tabBar.querySelectorAll('.tab'));
      var panels = Array.prototype.slice.call(pager.querySelectorAll('.pager__panel'));
      if (tabs.length === 0) return;

      // タブが貼り付く位置（ヘッダーの高さ）は CSS 側で確定させています。
      // 一度は JS で実測して合わせていましたが、測るタイミングによって
      // 1px ずれ、タブとの隙間から下の文字がチラつきました。
      // 店名・卓名を1行に固定してヘッダーの高さを動かさないようにしたので、
      // 測る必要そのものが無くなっています（app.css の 25章）。

      var current = -1;

      // 面の高さは中身の量でまるで違います（お好み焼き 5 品 ／ ドリンク 30 品以上）。
      // 横に並べた箱の高さは「いちばん高い面」に合ってしまうので、
      // 何もしないと短い面を見ているとき、下に何画面ぶんもの空白が続きます。
      // 表示中の面の高さに合わせて、箱の高さを詰めます。
      function fitHeight(index) {
        var panel = panels[index];
        if (panel) pager.style.height = panel.offsetHeight + 'px';
      }

      // どのタブを見ていたかを覚えておく場所。
      // sessionStorage はタブを閉じると消えるので、次に来たお客さんには残りません。
      // 卓ごとに分ける必要もありません（1台のスマホ＝1人の閲覧）。
      var STORE_KEY = 'komeko.menuTab';
      var SCROLL_KEY = 'komeko.menuScroll';

      function remember(index) {
        // プライベートモードや容量超過で例外が出ることがある。
        // 覚えられなくても本体の動作は続けたいので、黙って諦める。
        try { sessionStorage.setItem(STORE_KEY, String(index)); } catch (e) { /* 気にしない */ }
      }

      /* 縦の位置も覚える。
         ドリンクは 30 品以上あるので、下のほうの品を見て戻ってくると
         毎回いちばん上からスクロールし直すことになります。
         タブだけ合っていても、探し直す手間は変わりません。

         ★ タブごとに別々に覚えます。
           面によって長さがまるで違う（お好み焼き 5 品／ドリンク 30 品以上）ので、
           1 つの値を使い回すと、短い面に長い面の位置を当てることになります。 */
      function rememberScroll() {
        if (current < 0) return;
        try {
          var saved = {};
          try { saved = JSON.parse(sessionStorage.getItem(SCROLL_KEY)) || {}; } catch (e) { saved = {}; }
          saved[current] = Math.round(window.scrollY);
          sessionStorage.setItem(SCROLL_KEY, JSON.stringify(saved));
        } catch (e) { /* 気にしない */ }
      }

      function savedScrollFor(index) {
        try {
          var saved = JSON.parse(sessionStorage.getItem(SCROLL_KEY)) || {};
          var y = saved[index];
          return (typeof y === 'number' && y > 0) ? y : 0;
        } catch (e) { return 0; }
      }

      function activate(index) {
        if (index === current || index < 0 || index >= tabs.length) return;
        current = index;
        remember(index);
        fitHeight(index);
        tabs.forEach(function (tab, i) {
          var on = (i === index);
          tab.classList.toggle('is-active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        // 選ばれたタブが画面の外にあると押せたことに気づけないので、見える位置へ寄せる
        tabs[index].scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
      }

      // 1. いまどの面にいるかを、スクロール位置から求める。
      //
      //    面はどれも画面ぴったりの幅なので、
      //    「横に何画面ぶん進んだか」を四捨五入すれば面の番号になります。
      //
      //    最初は IntersectionObserver（要素が見えたら教えてくれる仕組み）で
      //    書いていましたが、横スクロールする箱を root にすると
      //    環境によってはコールバックが一度も飛ばず、タブが追随しませんでした。
      //    割り算 1 回で確実に出せるものを、わざわざ凝った仕組みに任せる必要はありません。
      //
      //    scroll は指を動かしているあいだ何十回も飛んできますが、
      //    ここでやるのは割り算 1 回だけで、
      //    番号が変わらなければ activate() が即座に戻ります。
      //    requestAnimationFrame で間引く手もありますが、
      //    タブが裏に回っているあいだ rAF は呼ばれないため、
      //    「間引き待ち」のまま止まる状態を作らないほうが確実です。
      pager.addEventListener('scroll', function () {
        var width = pager.clientWidth;
        if (width === 0) return;
        activate(Math.round(pager.scrollLeft / width));
      }, { passive: true });   // passive: スクロールを妨げないと宣言して滑らかさを保つ

      // 2. タブを押したらその面へ寄せる
      tabs.forEach(function (tab, index) {
        tab.addEventListener('click', function () {
          var panel = panels[index];
          if (!panel) return;
          pager.scrollTo({ left: panel.offsetLeft, behavior: 'smooth' });
          activate(index);
        });
      });

      // 3. キーボードの左右でも動かせるようにする（タブに焦点がある間だけ）
      tabBar.addEventListener('keydown', function (e) {
        var delta = (e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowLeft') ? -1 : 0;
        if (delta === 0) return;
        var next = current + delta;
        if (next < 0 || next >= tabs.length) return;
        e.preventDefault();
        tabs[next].click();
        tabs[next].focus();
      });

      // 画面の向きを変えたり文字サイズを変えたりすると高さが変わるので測り直す。
      // このとき面の幅も変わっているので、いまの面へ位置を合わせ直します。
      window.addEventListener('resize', function () {
        if (current < 0) return;
        pager.style.height = '';                    // いったん外して本来の高さを測れるようにする
        pager.scrollLeft = panels[current].offsetLeft;
        fitHeight(current);
      });

      // 開いたときは「さっき見ていたタブ」から始める。
      //
      // もとは無条件に activate(0) でした。つまり、たこ焼きの商品を見てから
      // 「メニューに戻る」を押すと、必ずお好み焼きに飛ばされていました。
      // 一覧 → 商品 → 戻る、は注文のあいだ何度も繰り返す動きなので、
      // そのたびに横スワイプで探し直すことになります。
      //
      // ★ scrollLeft を直接入れているのは、smooth にしないため。
      //   戻った瞬間に画面が横に流れると「操作していないのに動いた」と感じます。
      //   復元は一瞬で終わってほしい。
      (function restore() {
        var saved = -1;
        try { saved = parseInt(sessionStorage.getItem(STORE_KEY), 10); } catch (e) { /* 読めなければ先頭 */ }
        if (isNaN(saved) || saved < 0 || saved >= tabs.length) saved = 0;
        if (saved > 0 && panels[saved]) {
          pager.scrollLeft = panels[saved].offsetLeft;
        }
        activate(saved);

        /* 縦の位置を戻す。
           ★ 画像の読み込みで高さが変わるので、すぐに戻すとずれます。
             fitHeight で面の高さを入れ直したあと、
             もう一度だけ位置を合わせ直します。 */
        var y = savedScrollFor(saved);
        if (y > 0) {
          window.scrollTo(0, y);
          window.requestAnimationFrame(function () {
            fitHeight(saved);
            window.scrollTo(0, y);
          });
          window.addEventListener('load', function () {
            fitHeight(saved);
            window.scrollTo(0, y);
          }, { once: true });
        }
      })();

      /* 縦位置は動かすたびに覚える。
         スクロールは何十回も飛んでくるので、少し待ってからまとめて書き込む。
         書き込み自体は軽いが、毎回 JSON を作り直す必要はない。 */
      var scrollTimer = null;
      window.addEventListener('scroll', function () {
        if (scrollTimer) return;
        scrollTimer = window.setTimeout(function () {
          scrollTimer = null;
          rememberScroll();
        }, 150);
      }, { passive: true });

      /* 商品を押して離れる瞬間にも確実に残す。
         スマホでは pagehide のほうが確実に呼ばれる（beforeunload は無視されることがある）。 */
      window.addEventListener('pagehide', rememberScroll);
    })();
  </script>

</main>
</body>
</html>
