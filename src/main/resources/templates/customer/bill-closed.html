<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout('ご来店ありがとうございました', ~{::main})}">
<body>
<main>
  <div class="container">

    <div class="empty-state mt-6">
      <div class="empty-state__mark">礼</div>
      <h1>ご来店ありがとうございました</h1>
      <p class="lead">
        <span th:if="${tableName}" th:text="${tableName}">3番テーブル</span>
        のお会計は完了しております。
      </p>
    </div>

    <div class="card">
      <div class="card__body">
        <p class="mb-0 small muted">
          追加でご注文される場合は、お手数ですがテーブルの QR コードをもう一度お読みください。
          お会計の内容についてのお問い合わせは、レジのスタッフまでお願いします。
        </p>
      </div>
    </div>

  </div>
</main>
</body>
</html>
