<!DOCTYPE html>
<!--/*
   ご注文内容の確認（設計「暗06 注文内容の確認」）

   ★ この画面はまだ「頼む前」です。
     いちばん下のボタンを押して初めて厨房に届きます。
     押し忘れたまま待たれるのがいちばん困るので、
     設計の節見出しにも「まだ注文は未確定です。」と書いてあります。

   ★ 設計の行には「変更」ボタンが 1 つあるだけで、
     −／＋／削除 は描かれていません。
     ただし押した先が設計に無いので、こちらで決めました。

       変更 → その行の −／＋／削除 がその場で開く（<details>）

     商品ページへ飛ばす案もありましたが、あちらは「カートに入れる」しか
     持っていないので、押すと同じ品がもう 1 行増えます。
     直したいのに増えるのは、直せないより悪い。
     JavaScript を足さずに開閉できる <details> にしてあります。
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout('ご注文内容の確認', ~{::main})}">
<body>
<main>
  <!--/* 左右 16px（.container の既定）。設計 暗06 の本文は px-16 で、
         中身の幅は 390 − 32 = 358 になる。
         伝票（暗04）だけが 24px なので、そこと同じにしないこと。

         下の余白は固定バーのぶん（.submitbar-room）。
         これが無いと最後の行がボタンの下に隠れる。 */-->
  <div class="container submitbar-room">

    <p class="small"><a th:href="@{/}">← メニューに戻る</a></p>

    <div th:replace="~{fragments/common :: flash}"></div>

    <!--/* 節見出し（暗/節見出し）。左のきつね色の丸は .theme-night が ::before で描く。
           設計では品数を出していないので、右側は空にしてある */-->
    <div class="section-title">
      <h1 class="section-title__text" th:if="${!cart.empty}">まだ注文は未確定です。</h1>
      <h1 class="section-title__text" th:if="${cart.empty}">ご注文内容の確認</h1>
    </div>

    <!--/* ===== まだ何も選ばれていない ===== */-->
    <div th:if="${cart.empty}">
      <div th:replace="~{fragments/common :: empty('未', 'まだ何も選ばれていません')}"></div>
      <a class="btn btn--primary btn--block" th:href="@{/menu}">メニューを見る</a>
    </div>

    <!--/* ===== カートの中身（暗/注文内容の行） ===== */-->
    <div th:unless="${cart.empty}">

      <div class="order-list">
        <div class="order-row" th:each="line : ${cart.lines}">

          <div class="order-row__main">
            <div class="order-row__name">
              <span th:text="${line.menuItemName}">肉玉米粉そば</span>
              <span th:text="' ×' + ${line.quantity}"> ×1</span>
            </div>
            <div class="order-row__opts" th:if="${!line.options.isEmpty()}"
                 th:text="${line.optionSummary}">チーズ ／ 餅</div>
          </div>

          <div class="order-row__side">
            <div class="order-row__amount"
                 th:text="'¥' + ${#numbers.formatInteger(line.subtotal, 1, 'COMMA')}">¥1,510</div>

            <!--/* 開いている状態を保てるように、行ごとに name を分けない。
                   1 つ開いたら他が閉じる（name を共有する）ほうが画面は静かだが、
                   2 品まとめて直したい人が押し直すことになるので、独立させてある */-->
            <details class="order-row__edit">
              <summary class="order-row__editbtn">変更</summary>

              <!--/* フォームは入れ子にできないので、操作ごとに分ける */-->
              <div class="order-row__controls">
                <form th:action="@{/cart/update}" method="post">
                  <input type="hidden" name="key" th:value="${line.key}">
                  <input type="hidden" name="quantity" th:value="${line.quantity - 1}">
                  <button class="btn btn--sm" type="submit" aria-label="1つ減らす">−</button>
                </form>

                <span class="order-row__qty num" th:text="${line.quantity}">1</span>

                <form th:action="@{/cart/update}" method="post">
                  <input type="hidden" name="key" th:value="${line.key}">
                  <input type="hidden" name="quantity" th:value="${line.quantity + 1}">
                  <button class="btn btn--sm" type="submit" aria-label="1つ増やす">＋</button>
                </form>

                <form th:action="@{/cart/remove}" method="post">
                  <input type="hidden" name="key" th:value="${line.key}">
                  <button class="btn btn--sm btn--ghost" type="submit">削除</button>
                </form>
              </div>
            </details>
          </div>

        </div>
      </div>

      <!--/* 小計（暗/合計行）。伝票の合計と同じ部品を使う。
             ★ ここは「小計」であって「ご請求額」ではない。
               消費税・テーブルチャージ・深夜料金は伝票にまとめて計算される */-->
      <div class="bill-total bill-total--boxed">
        <span class="bill-total__label">小計</span>
        <span class="bill-total__amount"
              th:text="'¥' + ${#numbers.formatInteger(cart.totalAmount, 1, 'COMMA')}">¥3,150</span>
      </div>
      <p class="bill-note">
        消費税・テーブルチャージを含むご請求額は、お席の伝票にまとめて計算されます。
      </p>

      <!--/* ===== 受付停止中のお知らせ ===== */-->
      <div class="alert alert--warn mt-6" th:unless="${accepting}" role="alert">
        <p class="mb-0" th:text="${rejectReason}">ただいま受付を停止しております</p>
      </div>

      <!--/* ===== 注文フォーム ===== */-->
      <form th:action="@{/checkout}" method="post" class="mt-6">
        <div class="field">
          <label class="label" for="note">ご要望（任意）</label>
          <textarea class="textarea" id="note" name="note" maxlength="200"
                    placeholder="例）ソース少なめでお願いします" th:text="${cart.note}"></textarea>
          <p class="help">アレルギー等の重要なご相談は、お手数ですがスタッフへ直接お伝えください。</p>
        </div>

        <div class="alert alert--info">
          <p class="mb-0">
            <span th:if="${tableName}"><b th:text="${tableName}">3番テーブル</b> へお持ちします。</span>
            お会計はご退店時にレジまでお願いします。
          </p>
        </div>

        <!--/* 送信ボタン（下に固定）。設計 暗06 は画面の下辺に貼り付いた 124px の帯。
               押してから厨房に届くまでが、この画面でいちばん待たされる。
               反応が無いともう一度押されて、同じ品が二重に入る。
               customer.js が文字を差し替え、二重送信も止める。 */-->
        <div class="submitbar">
          <button type="submit" class="btn btn--primary btn--lg btn--block"
                  th:disabled="${!accepting}"
                  data-sending-label="送信中">この内容で注文する</button>
        </div>
      </form>

      <p class="center mt-6">
        <a class="small muted" href="#" onclick="document.getElementById('clear-cart').submit();return false;">
          すべて取り消す
        </a>
      </p>
      <form id="clear-cart" th:action="@{/cart/clear}" method="post" hidden></form>
    </div>

  </div>
</main>
</body>
</html>
