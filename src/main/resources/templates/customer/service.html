<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout('サービス', ~{::main})}">
<body>
<main>
  <!--/* 設計「暗03 サービス」。本文の左右は 24px、タイルは 3 列。

         この画面にはカテゴリの帯が無い（設計どおり）。
         タイルが 7 つしかないので、さらに分ける必要がない。 */-->
  <div class="container bill-page">

    <div th:replace="~{fragments/common :: flash}"></div>

    <!--/*
      ===== 持っていく物 =====
      押すと注文リストに入る。<b>ここではまだ送らない。</b>
      商品とまったく同じで、確定するのは「注文へ進む」のあと。

      1 回押しただけで送る作りにしていたが、店主から
      「確定させるまで送信しましたと出したくない。商品注文と同じ処理にしてほしい」。
      押した瞬間に送る口がここだけ違うと、お客さまは
      「押したら出てくるのか、まだなのか」を画面ごとに覚え直すことになる。

      form を 1 タイルにつき 1 つ置いている。button を form の外に出して
      form 属性で結ぶ手もあるが、入れ子にできない form を並べるほうが素直で、
      JavaScript が無くても確実に動く。
    */-->
    <div class="svc-grid mt-6">
      <form th:each="item : ${items}" th:action="@{/service/items/{id}(id=${item.id})}" method="post">
        <button type="submit" class="svc-tile">
          <!--/* 設計で画像として置かれているアイコン。ベクタが無いので画像のまま使う */-->
          <img class="ic" th:if="${imageIcons.containsKey(item.name)}"
               th:src="@{'/images/icons/' + ${imageIcons.get(item.name)}}" alt="" aria-hidden="true">
          <!--/* ベクタで持っているものは文字色に追従させる。

                 ★ th:if と th:replace を同じタグに書かないこと（CLAUDE.md）。
                   th:replace が先に評価されて th:if が無視され、
                   名前が null のまま icons.html を丸ごと差し込む。
                   実際それで 1 タイルにアイコンが 20 個入っていた。
                   条件は外側の th:block に持たせる。 */-->
          <th:block th:if="${svgIcons.containsKey(item.name)}">
            <th:block th:replace="~{fragments/icons :: __${svgIcons.get(item.name)}__}"/>
          </th:block>
          <span th:text="${item.name}">お水</span>
        </button>
      </form>
    </div>

    <!--/*
      ===== 呼びかけ =====
      物が伴わないのでホール画面に出る（厨房ボードには出さない）。
      売上にも注文数にも混ざらない。理由は ServiceCallType のコメント。

      「スタッフを呼ぶ」だけ枠を広く取ってある。用件が決まっていないときの
      いちばん頼りになる逃げ道なので、探さずに押せる大きさにしておく。

      ★ こちらは注文リストに入らない。物が伴わないので、確定する対象が無い。
        代わりに 1 枚確認を挟む。上の物と違って押した瞬間に人が動くので、
        指が当たっただけで呼んでしまうのを止めたい。
        取り消す手段がお客さま側に無いぶん、押す前に止めるほうが確実。
    */-->
    <div class="svc-grid svc-grid--calls mt-4">
      <form th:each="type : ${calls}" th:action="@{/service/call/{t}(t=${type})}" method="post">
        <button type="submit" class="svc-tile svc-tile--call"
                th:onclick="'return confirm('' + ${type.customerLabel} + '。よろしいですか？')'">
          <!--/* ここも同じ。条件を同じタグに書くと両方とも描かれ、
                 1 つのタイルにベルと領収書が並ぶ */-->
          <th:block th:if="${type.name() == 'STAFF'}">
            <th:block th:replace="~{fragments/icons :: ic_bell}"/>
          </th:block>
          <th:block th:unless="${type.name() == 'STAFF'}">
            <th:block th:replace="~{fragments/icons :: ic_receipt}"/>
          </th:block>
          <span th:text="${type.customerLabel}">スタッフを呼ぶ</span>
        </button>
      </form>
    </div>

    <p class="tiny faint center mt-6">
      押すとスタッフに届きます。何度も押さなくて大丈夫です。
    </p>

  </div>
</main>
</body>
</html>
