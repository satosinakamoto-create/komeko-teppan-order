<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout(${item.name}, ~{::main})}">
<body>
<main>
  <div class="container">

    <!--/* モーダルで開いたときは要らない（やめる／Esc／背面で閉じる）。
           CSS の .sheet-modal__body .back-link で隠している */-->
    <p class="small back-link"><a th:href="@{/}">← メニューに戻る</a></p>

    <div th:replace="~{fragments/common :: flash}"></div>

    <article class="card mt-4">
      <img th:if="${item.imagePath != null}" th:src="@{${item.imagePath}}" th:alt="${item.name}"
           style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px 12px 0 0">

      <div class="card__body">
        <h1 class="mb-0" th:text="${item.name}">コンプレット</h1>
        <div th:replace="~{fragments/common :: allergens(${item})}"></div>

        <p class="lead mt-4" th:if="${item.description}" th:text="${item.description}">説明文</p>

        <p class="menu-item__price" style="font-size:1.5rem">
          <span th:replace="~{fragments/common :: price(${item})}">¥880</span>
          <small th:if="${item.price > 0}">税込</small>
        </p>

        <!--/* 時価の品は、なぜ金額が出ていないのかをその場で説明する。
               「時価」だけだと、値段を隠されたように受け取る人もいる */-->
        <p class="help mb-0" th:if="${item.price <= 0}">
          仕入れによって価格が変わるため、当日の金額はスタッフにお尋ねください。
        </p>

        <!--/* 数量限定の品は残りの数を目立たせる */-->
        <p class="small bold mb-0" style="color: var(--accent)"
           th:if="${item.stockTracked and !item.outOfStock}"
           th:text="'数量限定 ― 残り ' + ${item.stockRemaining} + ' 点'">数量限定 ― 残り 3 点</p>

        <p class="tiny faint mb-0" th:if="${item.cookMinutes > 0}"
           th:text="'焼き上がりの目安：約 ' + ${item.cookMinutes} + ' 分'">焼き上がりの目安：約 8 分</p>
      </div>
    </article>

    <!--/* ===== 売り切れ・受付停止のときは注文フォームを出さない =====
           「手動の品切れフラグ」と「残数ゼロ」はどちらも売り切れとして扱う */-->
    <div class="alert alert--warn mt-6" th:if="${item.soldOut or item.outOfStock}" role="alert">
      <p class="mb-0">申し訳ありません。こちらの商品は売り切れました。</p>
    </div>
    <div class="alert alert--warn mt-6" th:if="${item.orderable and !accepting}" role="alert">
      <p class="mb-0">ただいまご注文を受け付けておりません。</p>
    </div>

    <!--/* ===== 注文フォーム ===== */-->
    <form th:if="${item.orderable and accepting}"
          th:action="@{/cart/add}" method="post"
          id="add-form" class="mt-6"
          th:attr="data-base-price=${item.price}">

      <input type="hidden" name="menuItemId" th:value="${item.id}">

      <!--/* data-min は「この組に最低いくつ要るか」。
             JS がここを読んで、足りないあいだ注文のボタンを押せなくする。
             値はサーバが持っている minSelect そのままで、画面では作らない。 */-->
      <section th:each="g : ${item.optionGroups}" class="mt-6"
               th:attr="data-min=${g.minSelect}">
        <div class="section-title" style="margin-block:0 12px">
          <h2 class="section-title__text" style="font-size:1.0625rem" th:text="${g.name}">サイズ</h2>
          <span class="badge badge--rec" th:if="${g.required}">必須</span>
          <span class="section-title__count" th:unless="${g.required}"
                th:text="'任意・' + ${g.maxSelect} + 'つまで'">任意</span>
        </div>

        <!--/* 1つだけ選ぶ場合はラジオ、複数選べる場合はチェックボックス */-->
        <label class="choice" th:each="c : ${g.choices}"
               th:classappend="${c.soldOut} ? 'is-soldout'">

          <input th:if="${g.singleChoice}" type="radio"
                 th:name="'single_' + ${g.id}"
                 th:value="${c.id}"
                 th:checked="${c.defaultSelected}"
                 th:disabled="${c.soldOut}"
                 th:required="${g.required}"
                 th:attr="data-price=${c.extraPrice}">

          <input th:unless="${g.singleChoice}" type="checkbox"
                 name="choiceIds"
                 th:value="${c.id}"
                 th:checked="${c.defaultSelected}"
                 th:disabled="${c.soldOut}"
                 th:attr="data-price=${c.extraPrice}, data-group=${g.id}, data-max=${g.maxSelect}">

          <span class="choice__name" th:text="${c.name}">レギュラー</span>
          <span class="choice__price" th:if="${c.extraPrice > 0}"
                th:text="'+¥' + ${#numbers.formatInteger(c.extraPrice, 1, 'COMMA')}">+¥200</span>
          <span class="choice__price" th:if="${c.extraPrice < 0}"
                th:text="'−¥' + ${#numbers.formatInteger(-c.extraPrice, 1, 'COMMA')}">−¥50</span>
          <span class="badge badge--soldout" th:if="${c.soldOut}">品切れ</span>
        </label>
      </section>

      <!--/* ===== 個数 ===== */-->
      <div class="row row--between mt-6">
        <span class="label mb-0" style="margin:0">個数</span>
        <div class="qty">
          <button type="button" class="qty__btn" data-qty-step="-1" aria-label="1つ減らす">−</button>
          <!--/* 数量限定の品は、残数より多い個数を最初から選べないようにする。
                 これは使い勝手のための制限で、本当の売り越え防止は
                 サーバ側（注文確定時の条件付き UPDATE）が行う */-->
          <input class="qty__value" type="number" name="quantity" id="quantity"
                 value="1" min="1" inputmode="numeric" aria-label="個数"
                 th:max="${item.stockTracked and item.stockRemaining < 20} ? ${item.stockRemaining} : 20">
          <button type="button" class="qty__btn" data-qty-step="1" aria-label="1つ増やす">＋</button>
        </div>
      </div>

      <div class="cart-bar mt-6">
        <div class="cart-bar__inner">
          <!--/* 先頭のテキストは JS が「あと1種類」に差し替える。
                 <span> で包まないのは、包むと最初の子が要素になり、
                 firstChild の差し替えで金額まで消えるため */-->
          <button type="submit" class="btn btn--primary btn--lg btn--block">注文リストに追加
            <span id="add-total"
                  th:text="${item.price > 0}
                           ? '¥' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}
                           : '時価'">¥880</span>
          </button>
        </div>
      </div>
    </form>

  </div>

  <!--/* customer.js はレイアウト（layout/customer.html）で読み込む。 */-->
</main>
</body>
</html>
