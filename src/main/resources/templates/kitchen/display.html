<!DOCTYPE html>
<!--/*
   ============================================================================
   店頭サイネージ（番号呼び出し画面）
   ----------------------------------------------------------------------------
   ・レイアウトは layout/plain を使います。
     ヘッダーもナビもログアウトボタンも無い最小構成で、画面いっぱいを
     番号だけに使えるためです（layout/staff はナビが付くので使いません）。
     <head> を各ページで書き写すと、あとで meta や CSS の読み込みを直すときに
     直し漏れが出るので、共通レイアウトに任せます。
   ・CSS は共通の app.css をそのまま使います（16章「呼び出しサイネージ」）。
   ・番号の初期値はサーバ側（DisplayController）が描き込み、
     そのあとの更新は js/display.js が DOM を差し替えて行います。
     ページ全体をリロードすると一瞬白くチラつき、店内から見て格好悪いためです。
   ============================================================================
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/plain :: layout(${shop.shopName + ' 番号呼び出し'}, ~{::main})}">
<body>
<main>

  <div class="signage">

    <!--/* ====== 見出し（店名 ＋ 時計） ====== */-->
    <header class="signage__head">
      <h1 class="signage__shop" th:text="${shop.shopName}">米粉と鉄板</h1>
      <!--/* 時計の中身は display.js が 1 秒ごとに書き換えます（HH:MM） */-->
      <div class="signage__clock" id="clock">--:--</div>
    </header>

    <!--/* ====== 番号のパネル（左：調理中／右：お呼び出し中） ====== */-->
    <div class="signage__panels">

      <!--/* ── 左：調理中 ───────────────────────────────────────── */-->
      <section class="signage__panel">
        <h2 class="signage__panel-title">調理中</h2>

        <!--/*
           .number-grid は中身が空でも高さ 0 になるだけなので、常に置いておきます。
           こうしておくと JavaScript は「必ず存在する箱」に対して
           セルを足す／減らすだけで済み、要素を探し直す必要がありません。
        */-->
        <div class="number-grid" id="cooking-grid">
          <div class="number-cell" th:each="n : ${cookingNumbers}" th:text="${n}">101</div>
        </div>

        <!--/*
           0 件のときだけ出す「—」。
           th:if で消してしまうと DOM から居なくなり JS が掴めなくなるので、
           要素は常に残したまま hidden 属性の有無で出し分けます。
           th:attr は式の結果が null のとき、その属性ごと出力しません。
        */-->
        <p class="signage__empty" id="cooking-empty"
           th:attr="hidden=${#lists.isEmpty(cookingNumbers)} ? null : 'hidden'">—</p>
      </section>

      <!--/* ── 右：お呼び出し中（暖色に光る） ──────────────────── */-->
      <section class="signage__panel signage__panel--ready">
        <h2 class="signage__panel-title">お呼び出し中</h2>

        <div class="number-grid" id="ready-grid">
          <div class="number-cell number-cell--ready"
               th:each="n : ${readyNumbers}" th:text="${n}">99</div>
        </div>

        <p class="signage__empty" id="ready-empty"
           th:attr="hidden=${#lists.isEmpty(readyNumbers)} ? null : 'hidden'">—</p>
      </section>

    </div>

    <!--/*
       ====== 画面下の案内 ======
       文言は管理画面から変えられる ${shop.pickupNotice} を使います。
       ここに直接書いてしまうと、店頭の案内を変えたときにこの画面だけ
       古い文言が残り、控えページ（customer/order.html）と食い違います。

       .signage__empty の色は「暗い背景の上の控えめな白」に調整済みなので、
       ここでも流用しています（.faint などの汎用クラスは OS のライト／ダーク設定で
       色が変わるのに対し、サイネージの背景は常に鉄黒で固定のため）。
       文字の大きさだけ .small で落とします。
    */-->
    <p class="signage__empty center small mb-0" th:text="${shop.pickupNotice}">
      番号をお呼びしましたらカウンターまでお越しください</p>

  </div>

  <!--/*
     defer を付けると「HTML を全部読み終わってから」実行されます。
     おかげでスクリプト側で DOMContentLoaded を待つ必要がなく、
     getElementById がいきなり使えます。
  */-->
  <script th:src="@{/js/display.js}" defer></script>
</main>
</body>
</html>
