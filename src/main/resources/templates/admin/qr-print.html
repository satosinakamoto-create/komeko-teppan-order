<!DOCTYPE html>
<!--/*
   卓ごとの卓上ポップ（印刷用）。

   卓の数だけ .print-sheet を並べます。app.css の @media print で
   2 枚ごとに改ページするので、ブラウザの印刷（Ctrl+P）で
   1 枚 = 2 卓 に分かれます（設計 ト13b・841:10452／2026-09-20）。

   ★ 札は破線で囲ってあります。これは飾りではなく切り取り線です。
     印刷したら線で切って、1 枚ずつ卓に置いてください。

   ★ 手順（①スマホのカメラで…）と「ご請求額は…」の段落は、
     2026-09-20 に設計へ寄せたときに落としました。
     人数の選択はお客さまが注文を始める画面で必ず聞かれるので、
     紙から案内が消えてもテーブルチャージの計算には影響しません。

   ヘッダーやナビゲーションが紙に写り込まないよう、
   最小レイアウト（layout/plain）を使っています。
   画面でだけ見せたい案内やボタンには .no-print を付けており、
   印刷時には非表示になります。

   使えるモデルの値：
     ${tables}    … List<DiningTable>（稼働中の卓だけ）
     ${tableUrls} … Map<Long, String>（卓 id → QR に入る URL）
     ${size}      … QR 画像の 1 辺（px）
     ${baseUrl}   … いま設定されている app.base-url

   ★ 印刷したら、必ず「紙に書かれた卓名」と「貼る席」を照合してください。
     貼り間違えると、料理がまるごと別の席に運ばれます。
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/plain :: layout('卓の QR ポップ（印刷用）', ~{::main})}">
<body>
<main>
  <div class="container">

    <div class="row row--wrap no-print" style="padding-top:16px">
      <a class="btn" th:href="@{/admin/qr}">← QR の画面に戻る</a>
      <span class="spacer"></span>
      <span class="help mb-0">ブラウザの印刷（Ctrl+P）で、1 枚に 2 卓ずつ印刷されます。破線で切ってお使いください。</span>
    </div>

    <div class="alert alert--warn no-print mt-4">
      <p class="mb-0">
        いまの飛び先は <code th:text="${baseUrl} + '/t/…'">http://localhost:8080/t/…</code> です。
        <code>localhost</code> のままだと、お客さんのスマホからは開けません。
        印刷する前に必ず確認してください。
      </p>
    </div>

    <div class="no-print" th:if="${tables.isEmpty()}">
      <div th:replace="~{fragments/common :: empty('席', '印刷できる卓がありません。「卓」の画面で席を登録し、「使う」にチェックを入れてください')}"></div>
    </div>

    <!--/* ===== ここから 1 枚 = 2 卓 =====
           並び順は設計 ト13b の札どおり：
             店名（小さく・灰）／ 卓名（大きく・太字）／ QR ／ 一行の案内 ／ URL
           改ページは app.css が .print-sheets の 2 枚目ごとに入れます。
           囲む div を外すと、nth-child が他の要素まで数えてしまって
           改ページの位置がずれるので、この入れ物は消さないこと。 */-->
    <div class="print-sheets mt-4">
      <div class="print-sheet" th:each="t : ${tables}">

        <p class="print-sheet__shop" th:text="${shop.shopName}">米粉と鉄板</p>

        <!--/* 卓名はいちばん大きく。貼り間違いを防ぐための、いちばん大事な情報です */-->
        <p class="print-sheet__table" th:text="${t.name}">カウンター1</p>

        <img class="print-sheet__qr"
             th:src="@{/admin/qr/image(tableId=${t.id},size=${size})}"
             th:alt="${t.name} + ' の注文用QRコード'">

        <p class="print-sheet__lead">スマホで読み取ってご注文ください</p>

        <p class="print-sheet__url" th:text="${tableUrls.get(t.id)}">http://localhost:8080/t/xxxx</p>

      </div>
    </div>

    <p class="help no-print">
      印刷したら、紙に書かれた卓名と貼る席が合っているか必ず確認してください。
      貼り間違えると、その席のご注文がまるごと別の席の伝票に入ってしまいます。
    </p>

  </div>
</main>
</body>
</html>
