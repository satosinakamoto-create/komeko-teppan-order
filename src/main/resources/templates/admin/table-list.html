<!DOCTYPE html>
<!--/*
   卓の一覧（読むだけ）。設計 ト12 卓。

   ── なぜ「読む画面」と「直す画面」を分けたか（2026-09-14）──
   もとは /admin/tables を開いた瞬間に新規追加フォームが出て、
   その下に 1 行ずつ入力欄の付いた表が続いていました。

   ところがこの画面を開く理由のほとんどは
   「いま何卓あって、どこが稼働中か」を見ることで、直すのはたまにです。
   見るために開いたのに、いきなり書き換えられる画面が出るのは、
   押し間違いの的を常に置いてあるのと同じでした。
   カテゴリ（2026-09-07）・スタッフと同じ判断です。

   直すほうは「卓を 編集・追加」から /admin/tables/edit へ。

   使えるモデルの値：
     ${tables}      … List<DiningTable>（並び順 → id の順）
     ${totalSeats}  … 席数の合計（int）
     ${activeCount} … 稼働中の卓の数（long）
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout('卓', ~{::main})}">
<body>
<main>

  <div th:replace="~{fragments/common :: flash}"></div>

  <!--/* 見出し・件数・ボタンで 1 行（設計 見出し/ページ 24:1392） */-->
  <div class="page-head">
    <h1 class="page-head__title">卓</h1>
    <span class="page-head__sub"
          th:text="${tables.size()} + ' 卓 / ' + ${totalSeats} + ' 席'">12 卓 / 30 席</span>
    <span class="page-head__spacer"></span>
    <!--/* 「足す」と「直す」で入口を分ける（2026-09-15・設計 ト12）。
           編集は枠ボタン、新規追加は塗り——この画面でいちばんよくやるのは
           「卓を増やす」なので、そちらを主にする */-->
    <a class="btn" th:href="@{/admin/tables/edit}">編集</a>
    <a class="btn btn--primary" th:href="@{/admin/tables/new}">＋新規追加</a>
  </div>

  <!--/* 卓が 1 つも無いと QR が 1 枚も作れない。
         空のときは表を出さず、次にやることだけを出す。
         ★ これは「条件付きの注意書き」です（2026-09-14 に店主と決めた方針）。
           ふだんは Figma どおり「見出し＋表」の 2 ブロックで、
           問題があるときだけ帯が増えます。 */-->
  <div class="alert alert--warn" th:if="${tables.isEmpty()}" role="alert">
    <p class="mb-0">
      卓がまだありません。お客さんは卓の QR からしか注文できないので、
      先に <a th:href="@{/admin/tables/new}">卓を追加</a> してください。
    </p>
  </div>

  <div class="table-wrap" th:unless="${tables.isEmpty()}">
    <table class="table table--tables">
      <thead>
      <tr>
        <th>卓名</th>
        <th>席数</th>
        <th>エリア</th>
        <th>並び</th>
        <th>状態</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="t : ${tables}">
        <td>
          <a th:href="@{/admin/tables/edit}" th:text="${t.name}">3番テーブル</a>
        </td>
        <td class="num" th:text="${t.capacity} + ' 席'">4 席</td>
        <td th:text="${#strings.isEmpty(t.area)} ? '—' : ${t.area}">カウンター</td>
        <td class="num" th:text="${t.sortOrder}">10</td>
        <td>
          <span class="badge badge--ok" th:if="${t.active}">使用中</span>
          <span class="badge badge--stop" th:unless="${t.active}">利用停止中</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</main>
</body>
</html>
