<!DOCTYPE html>
<!--/*
   スタッフを追加する画面（設計 ト15c・1249:13925）。

   ★ 2026-09-20 に staff.html から切り出しました。
     店主の指示：「スタッフ追加とアカウント一覧を分けて表示して欲しい。
     情報量が多くてユーザーに負荷がかかるからさ」

     それまでは /admin/staff/edit の上半分がこのフォームで、下に全員ぶんの
     入力欄・パスワード欄・削除ボタンが並んでいました。1 人足しに来ただけの人に
     消すと戻せないものを見せ続ける理由がありません。

   ★ 送り先は POST /admin/staff のまま変えていません。
     変えると、開きっぱなしのタブからの送信や戻るボタンでの再送信が 404 になります
     （卓・カテゴリを分けたときと同じ判断）。

   ★ 戻り口は帯の中に 1 つだけ置きます。
     ト15b で「行き先が同じリンクが 2 つ縦に並んでいる」と指摘を受けています。

   使えるモデルの値：
     ${staffForm} … 入力値とエラー
     ${roles}     … StaffRole の一覧（権限の選択肢）
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout('スタッフを追加', ~{::main})}">
<body>
<main>

  <div th:replace="~{fragments/common :: flash}"></div>

  <!--/* 見出しの帯（設計 ト15c） */-->
  <div class="page-head">
    <a class="btn" th:href="@{/admin/staff}">← スタッフ一覧へ戻る</a>
    <h1 class="page-head__title">スタッフを追加</h1>
    <span class="page-head__spacer"></span>
  </div>

  <div class="card">
    <div class="card__head">スタッフを追加する</div>
    <div class="card__body">

      <form th:action="@{/admin/staff}" th:object="${staffForm}" method="post">
        <div class="grid grid--2">

          <div class="field">
            <label class="label" for="username">ユーザー名（ログイン ID）<span class="req">必須</span></label>
            <input class="input" type="text" id="username" th:field="*{username}"
                   th:errorclass="is-error" maxlength="40" autocomplete="off"
                   placeholder="例）kitchen-taro">
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">エラー</p>
            <p class="help">ログイン画面で入力する ID です。半角英数字と . _ - が使えます。あとから変更はできません。</p>
          </div>

          <div class="field">
            <label class="label" for="displayName">表示名<span class="req">必須</span></label>
            <input class="input" type="text" id="displayName" th:field="*{displayName}"
                   th:errorclass="is-error" maxlength="40" placeholder="例）厨房 たろう">
            <p class="error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">エラー</p>
            <p class="help">画面に出る名前です。「誰が注文を進めたか」の記録にもこの名前が残ります。</p>
          </div>

          <div class="field">
            <label class="label" for="password">パスワード<span class="req">必須</span></label>
            <input class="input" type="password" id="password" th:field="*{password}"
                   th:errorclass="is-error" maxlength="72" autocomplete="new-password">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">エラー</p>
            <p class="help">8 文字以上。保存されるのは暗号化された文字列だけで、入力したパスワードそのものは残りません。</p>
          </div>

          <div class="field">
            <label class="label" for="role">権限<span class="req">必須</span></label>
            <select class="select" id="role" th:field="*{role}" th:errorclass="is-error">
              <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}">スタッフ</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">エラー</p>
            <p class="help">
              スタッフ … 厨房画面（注文の進行）だけ。<br>
              管理者 … それに加えて、商品・売上・この画面まで操作できます。
            </p>
          </div>

        </div>

        <button type="submit" class="btn btn--primary btn--lg">このスタッフを追加する</button>
      </form>

    </div>
  </div>

</main>
</body>
</html>
