<!DOCTYPE html>
<!--/*
   スタッフ一覧（読むだけ）。設計 13 スタッフ（41:2170）。

   ── なぜ「読む画面」と「直す画面」を分けたか（2026-09-07）──
   カテゴリと同じ理由です。この画面を開く理由のほとんどは
   「誰がログインできる状態か」「最後に使ったのはいつか」を見ることで、
   追加や削除はたまにです。

   とくにここは<b>消すと二度と戻せない</b>ものが並びます。
   見に来ただけの画面に削除ボタンを常時置いておく理由がありません。

   直すほうは「スタッフ 編集・追加」から /admin/staff/edit へ。

   使えるモデルの値：
     ${staffList}       … List<StaffUser>
     ${currentStaffId}  … いまログインしている人の id（自分の行に印を付ける）
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout('スタッフ', ~{::main})}">
<body>
<main>

  <div th:replace="~{fragments/common :: flash}"></div>

  <div class="page-head">
    <h1 class="page-head__title">スタッフ</h1>
    <span class="page-head__sub" th:text="${staffList.size()} + ' 人'">3 人</span>
    <!--/* ボタンは のばす で右端へ送る（2026-09-16・店主の判断。左端は戻るの居場所）

           ★ 2026-09-20 に 1 つ → 2 つへ分けました（設計 ト15 732:4888）。
             それまでは「スタッフ 編集・追加」1 つで、追加したいだけの人も
             全員ぶんの入力欄と削除ボタンが並ぶ画面を通ることになっていました。
             卓（table-list.html）と同じ ［編集］［＋新規追加］の形にそろえます。 */-->
    <span class="page-head__spacer"></span>
    <!--/* 編集の口は緑の枠（btn--edit）。灰色は「戻る」に使う色なので、
           ここに使うと押せるものに見えません（2026-09-20・店主の指摘）。 */-->
    <a class="btn btn--edit" th:href="@{/admin/staff/edit}">編集</a>
    <a class="btn btn--primary" th:href="@{/admin/staff/new}">＋新規追加</a>
  </div>

  <!--/* 列幅は設計どおり 320 / 280 / 220 / 300（合計 1120） */-->
  <div class="table-wrap">
    <table class="table table--staff">
      <thead>
      <tr>
        <th>名前</th>
        <th>ログインID</th>
        <th>権限</th>
        <th>最終ログイン</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="s : ${staffList}">
        <td class="wrap">
          <!--/* ★ 名前はただの文字。リンクにしないこと（2026-09-20・店主の指摘）。
                 設計（ト11／ト12／ト15）はどれも黒の Regular で、リンクではありません。
                 緑の下線リンクだと「押せるもの」がこの画面に 2 系統できてしまい、
                 どこから直すのかが名前と編集ボタンに割れます。入口は編集ボタン 1 本に。 */-->
          <span th:text="${s.displayName}">店長</span>
          <!--/* 自分の行だと分かるようにする。権限を落とすときにいちばん危ないのが自分自身 */-->
          <span class="badge badge--rec" th:if="${currentStaffId != null and currentStaffId == s.id}">ログイン中</span>
          <!--/* 無効なアカウントは、消えてはいないがログインできない。
                 一覧に居るのに入れない、が分からないと調べようがない */-->
          <span class="badge" th:unless="${s.enabled}">無効</span>
        </td>
        <td th:text="${s.username}">admin</td>
        <td th:text="${s.role.label}">管理者</td>
        <!--/* 最終ログインが空欄なのは「一度もログインしていない」という意味。
               作ったまま使われていないアカウントが分かるので、
               ここは「—」ではなく、はっきりそう書く */-->
        <td>
          <span th:if="${s.lastLoginAt != null}"
                th:text="${#temporals.format(s.lastLoginAt, 'yyyy-MM-dd HH:mm')}">2026-09-02 17:20</span>
          <span class="faint" th:unless="${s.lastLoginAt != null}">まだログインなし</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</main>
</body>
</html>
