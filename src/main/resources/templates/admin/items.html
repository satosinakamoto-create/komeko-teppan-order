<!DOCTYPE html>
<!--/*
   商品一覧。状態でタブを分けた 1 枚の表。

   ── なぜカテゴリごとのカードをやめたか（2026-09-05）──
   もとはカテゴリごとに見出しを立て、商品 1 つを 1 枚のカードで出していました。
   94 品あるとカードが 94 枚縦に並び、「どれが止まっているか」を探すのに
   画面を何度もスクロールすることになります。

   店主がこの画面を開く理由は 2 つに絞れます。
     ・特定の 1 品を直したい      → 探す（検索）
     ・いま止まっている品を知りたい → 絞る（タブ）
   どちらもカテゴリ順の並びでは答えられないので、表とタブに置き換えました。
   カテゴリは列の 1 つとして残っています。

   使えるモデルの値：
     ${rows}          … List<MenuItem>（選ばれたタブで絞ったあと）
     ${tabs}          … List<TabView>（key / label / count / active）
     ${currentTab}    … いま選ばれているタブの key
     ${categoryNames} … Map<Long, String>（カテゴリ id → 名前）
     ${optionCounts}  … Map<Long, Integer>（商品 id → オプショングループ数）
     ${totalCount}    … 商品の総数
     ${visibleCount}  … 掲載中の数

   注意：MenuItem.optionGroups と category は遅延読み込み（LAZY）で、
   このアプリは画面描画中に DB 接続を持ちません（open-in-view: false）。
   テンプレートから item.optionGroups や item.category.name をたどってはいけません。
   コントローラが数え／写し取ったものを使います。
*/-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout('商品管理', ~{::main})}">
<body>
<main>

  <div th:replace="~{fragments/common :: flash}"></div>

  <!--/* ====== 見出しと「商品を追加」 ====== */-->
  <div class="page-head">
    <h1 class="page-head__title">商品</h1>
    <span class="page-head__sub" th:text="'掲載中 ' + ${visibleCount} + ' 品'">掲載中 94 品</span>
    <span class="page-head__spacer"></span>
    <a class="btn btn--primary" th:href="@{/admin/items/new}">＋商品を追加</a>
  </div>

  <!--/* カテゴリが 1 つも無いと商品を登録できない（商品は所属カテゴリが必須） */-->
  <div class="alert alert--warn" th:if="${categories.isEmpty()}" role="alert">
    <p class="mb-0">
      カテゴリがまだありません。商品はかならずどれかのカテゴリに属するので、
      先に <a th:href="@{/admin/categories/edit}">カテゴリ</a> を作ってください。
    </p>
  </div>

  <!--/* ====== 探す ======
         絞り込みではなく検索。94 品あると、目的の 1 品まで
         スクロールで辿り着くほうが遅い。
         いまは画面内での絞り込み（JS なし）は用意していないので、
         入力欄は名前で探すための送信フォームにしてある。 */-->
  <form class="searchbox" method="get" th:action="@{/admin/items}" role="search">
    <input type="hidden" name="tab" th:value="${currentTab}">
    <span class="searchbox__icon" aria-hidden="true">
      <th:block th:replace="~{fragments/icons :: ic_magnifying_glass}"/>
    </span>
    <!--/* th:value で打った語を戻す。戻さないと、検索したあとに欄が空になり
           「何で絞った結果を見ているのか」が画面から消える */-->
    <input class="searchbox__input" type="search" name="q" placeholder="商品を探す"
           th:value="${q}" aria-label="商品を探す">
  </form>

  <!--/* ====== 状態のタブ ＋ 表 ======
         タブと表の見出しのあいだに隙間を作らない。
         選ばれたタブが表とひと続きの面に見えることで、
         「この表はいまこの絞り込みの結果だ」が形で分かる。 */-->
  <div class="tabtable">

    <div class="tabtable__tabs" role="tablist">
      <a th:each="t : ${tabs}" class="tab"
         th:classappend="${t.active()} ? 'is-active'"
         th:href="@{/admin/items(tab=${t.key()}, q=${q})}"
         th:attr="aria-selected=${t.active()}" role="tab">
        <span class="tab__label" th:text="${t.label()}">すべて</span>
        <span class="tab__num">
          <span class="tab__count" th:text="${t.count()}">94</span><span class="tab__unit">品</span>
        </span>
      </a>
    </div>

    <div class="table-wrap">
      <table class="table table--items">
        <thead>
        <tr>
          <th>商品名</th>
          <th>カテゴリ</th>
          <th>価格（税込）</th>
          <th>掲載</th>
          <th>販売</th>
          <th>並び</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${rows}">
          <td>
            <a th:href="@{/admin/items/{id}/edit(id=${item.id})}" th:text="${item.name}">肉玉米粉そば</a>
          </td>
          <td th:text="${categoryNames.get(item.category.id)}">広島風お好み焼き</td>
          <!--/* 価格 0 は「時価」。共通フラグメントと同じ扱いにそろえる。

                 ★ ただし書きかけ（編集中）は別。
                   下書きは価格を空のまま保存できるので、DB には 0 が入る。
                   そこに「時価」と出すと、値段を決めずに保存しただけの品が
                   「その日の仕入れで決める品」に見える。意味がまるで違う。 */-->
          <td class="num">
            <span th:if="${item.price > 0}"
                  th:text="'¥' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}">¥1,180</span>
            <span class="faint" th:if="${item.price <= 0 and item.draft}">未入力</span>
            <span th:if="${item.price <= 0 and !item.draft}">時価</span>
          </td>
          <!--/* ====== 掲載 ／ 販売 ======
                 ★ 見た目はバッジのまま、押せるようにしてあります（2026-09-07）。
                   設計（08 商品）でもこの 2 列はバッジで、ボタンの形はしていません。
                   形を変えずに押せるようにしたのは、<b>状態を見ている場所と
                   変える場所を同じにする</b>ためです。
                   これまでは状態がここに出るのに、変えるには商品を開くか
                   品切れ・残数の画面へ移る必要がありました。

                 ★ 押した場所へ戻すため、タブと検索語を持たせています。 */-->
          <td>
            <!--/* ★ 書きかけ（編集中）はここで切り替えさせません。
                   まだ価格やカテゴリが空かもしれないので、
                   一覧のワンタップで掲載できてしまうと中身の無い品が
                   お客さまのメニューに並びます。
                   押すと編集画面へ連れて行き、そこで「掲載する」を押させます。 */-->
            <a th:if="${item.draft}" class="badge badge--draft"
               th:href="@{/admin/items/{id}/edit(id=${item.id})}"
               title="作りかけです。押すと続きから編集できます">編集中</a>
            <form th:unless="${item.draft}"
                  th:action="@{/admin/items/{id}/visibility(id=${item.id})}" method="post">
              <input type="hidden" name="tab" th:value="${currentTab}">
              <input type="hidden" name="q" th:value="${q}">
              <button type="submit" class="badge badge--act badge--gf" th:if="${item.visible}"
                      title="押すと掲載を止めます">掲載中</button>
              <button type="submit" class="badge badge--act" th:unless="${item.visible}"
                      title="押すと掲載します">掲載停止</button>
            </form>
          </td>
          <td>
            <!--/* 掲載していない品の販売状態は意味を持たないので出さない。
                   メニューに無いものが「販売中」でも「品切れ」でもない。
                   書きかけも同じ（まだメニューに出ていない） */-->
            <form th:if="${item.visible and !item.draft}"
                  th:action="@{/admin/items/{id}/sale(id=${item.id})}" method="post">
              <input type="hidden" name="tab" th:value="${currentTab}">
              <input type="hidden" name="q" th:value="${q}">
              <!--/* 残数ゼロの品切れはここでは押せません。
                     手で立てたフラグではなく数の結果なので、
                     ここで外しても次の注文で 0 に戻ります。
                     数は「品切れ・残数」の画面で入れ直します。 */-->
              <button type="submit" class="badge badge--act badge--stop"
                      th:if="${item.soldOut}" title="押すと販売を再開します">品切れ</button>
              <span class="badge badge--stop" th:if="${!item.soldOut and item.outOfStock}"
                    title="残数が 0 です。数は「品切れ・残数」の画面で入れ直します">品切れ</span>
              <button type="submit" class="badge badge--act badge--gf"
                      th:unless="${item.soldOut or item.outOfStock}"
                      title="押すと品切れにします">販売中</button>
            </form>
            <span class="faint" th:unless="${item.visible and !item.draft}">—</span>
          </td>
          <!--/* 並び替え。
                 上下ボタンが動かすのは<b>同じカテゴリの中だけ</b>です。
                 カテゴリをまたいで動かせてしまうと、並べ替えのつもりで
                 商品の所属が変わります。

                 絞り込んでいるとき（検索語あり・「すべて」以外のタブ）は出しません。
                 隣の行が本当の隣とは限らないので、押しても動かないように見える
                 ことがあり、そのほうが混乱するためです。 */-->
          <td class="num">
            <form th:if="${canReorder}" th:action="@{/admin/items/{id}/move(id=${item.id})}"
                  method="post" class="row">
              <button type="submit" name="up" value="true" class="btn btn--ghost btn--sm"
                      title="ひとつ上へ" aria-label="ひとつ上へ">↑</button>
              <button type="submit" name="up" value="false" class="btn btn--ghost btn--sm"
                      title="ひとつ下へ" aria-label="ひとつ下へ">↓</button>
              <span class="faint tiny" th:text="${item.sortOrder}">1</span>
            </form>
            <span th:unless="${canReorder}" class="faint" th:text="${item.sortOrder}">1</span>
          </td>
        </tr>
        <!--/* 0 件の理由が「タブ」なのか「検索語」なのかを分けて出す。
               検索して 0 件のときに「このタブに当てはまる商品はありません」と出ると、
               タブのせいに見えて、打った語のほうを疑えない */-->
        <tr th:if="${rows.isEmpty()}">
          <td colspan="6" class="center faint">
            <span th:if="${#strings.isEmpty(q)}">このタブに当てはまる商品はありません。</span>
            <span th:unless="${#strings.isEmpty(q)}"
                  th:text="'「' + ${q} + '」に当てはまる商品はありません。'">「◯◯」に当てはまる商品はありません。</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>
</body>
</html>
