#
# ============================================================================
#  共通設定（すべてのプロファイルで有効）
# ============================================================================
#  プロファイル = 環境ごとの設定切り替え。
#    dev  … 手元の開発用（H2 ファイル DB、H2 コンソール ON、テンプレキャッシュ OFF）
#    prod … 本番用（PostgreSQL、キャッシュ ON）
#  デフォルトは dev。本番では起動時に --spring.profiles.active=prod を付ける。
# ============================================================================
spring:
  application:
    name: komeko-order

  profiles:
    active: dev

  jpa:
    # open-in-view=false : 「View を描画する間も DB 接続を握りっぱなし」をやめる設定。
    # 初心者向けチュートリアルでは true のままのことが多いが、
    # 接続が枯渇しやすく本番では非推奨なので最初から false にしておく。
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tokyo

  servlet:
    multipart:
      # 商品画像のアップロード上限
      max-file-size: 5MB
      max-request-size: 6MB

  mvc:
    hiddenmethod:
      filter:
        # HTML のフォームは GET/POST しか送れないため、
        # <input type="hidden" name="_method" value="delete"> で DELETE を表現できるようにする
        enabled: true

  messages:
    basename: messages
    encoding: UTF-8

server:
  port: 8080
  servlet:
    session:
      # カートはセッションに置くので、来店中に切れない長さにする
      timeout: 3h
    encoding:
      charset: UTF-8
      force: true

# ----------------------------------------------------------------------------
#  アプリ固有の設定（AppProperties クラスに読み込まれる）
# ----------------------------------------------------------------------------
app:
  # QR コードに埋め込む URL のベース。
  # 店舗の Wi-Fi 内で使うなら http://192.168.x.x:8080 のように PC の IP を入れる。
  base-url: http://localhost:8080
  # 商品画像の保存先（アプリからの相対パス）
  upload-dir: ./data/uploads
  # 起動時にサンプルメニュー・初期スタッフを投入するか
  seed-on-startup: true

  # 初期管理者（初回起動時のみ作成される）
  #
  # ★ パスワードは空のままにしておくこと ★
  #   空にしておくと、初回起動時にランダムなパスワードが自動生成され、
  #   起動ログに 1 回だけ表示されます。ログイン後すぐ変更してください。
  #
  #   ここに固定のパスワードを書くと、そのファイルを Git にコミットした瞬間に
  #   パスワードが履歴に残ります。Git の履歴はあとから消すのが非常に大変なので、
  #   「設定ファイルに秘密を書かない」を最初から徹底するのが結局いちばん楽です。
  #
  #   どうしても固定したい場合は環境変数で渡してください:
  #     $env:INITIAL_ADMIN_PASSWORD = "..."   (PowerShell)
  initial-admin-username: admin
  initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}

  # ── スタッフ画面の接続元制限（第二の錠） ──────────────────────
  # ここに IP を書くと、/login /kitchen /hall /admin は
  # その IP からしか開けなくなる（お客さまの端末にはログイン画面すら出ない）。
  # 使い方:
  #   1. ルーターの「DHCP固定割当」でスタッフ端末の IP を予約する
  #   2. その IP を下に並べて再起動
  #   3. スマホ（許可外）で /login を開いて 403 になることを確認
  # 空のままなら制限なし。サーバPC自身(localhost)は常に許可される（閉め出し防止）。
  staff-access:
    allowed-ips: []
    # 例:
    # allowed-ips:
    #   - 192.168.1.21      # 厨房タブレット
    #   - 192.168.1.22      # ホールタブレット
    #   - 192.168.1.0/28    # 範囲でまとめる書き方（.0〜.15）

  # ── 自動バックアップ ──────────────────────────────────────────
  # DB（注文・伝票・会計）と商品画像を、定期的に別フォルダへ退避する。
  # 停電では DB は壊れないが、ディスク故障では全部消える。その保険。
  backup:
    enabled: true
    # 保存先。できれば別ドライブを指すよう変更するとなお安全（.gitignore 済み）
    dir: ./backups
    # 毎日 4:30（閉店 26:00 の後、営業日切替 5:00 の前）。書式は「秒 分 時 日 月 曜日」
    cron: "0 30 4 * * *"
    # 残す世代数。超えた分は古いものから自動削除
    keep: 14
    # アプリを閉じたときにも 1 回取る（閉店後に PC を落とす店ではこれが本命）
    backup-on-shutdown: true
    # 起動時の「追いつき」。最後のバックアップから startup-max-age-hours 以上
    # 空いていたら、起動した瞬間に 1 本取る。
    # 定時(4:30)に PC が落ちていた日や、前夜に電源を直接切られた日でも、
    # 翌日の起動時に必ず追いつけるようにするための保険
    backup-on-startup: true
    startup-max-age-hours: 20
    # 前回成功から N 分以内の自動バックアップは見送る（開発中の再起動連発対策）
    min-interval-minutes: 10
    # 2次コピー先。USB ドライブや OneDrive のフォルダを指定すると
    # この PC のディスク故障にも備えられる。例: "D:\\komeko-backup" や
    # "C:\\Users\\zaki\\OneDrive\\komeko-backup"。空なら無効
    extra-copy-dir: ""

logging:
  level:
    jp.komeko.order: INFO
