#
# ============================================================================
#  共通設定（すべてのプロファイルで有効）
# ============================================================================
#  プロファイル = 環境ごとの設定切り替え。
#    dev  … 手元の開発用（H2 ファイル DB、H2 コンソール ON、テンプレキャッシュ OFF）
#    prod … 本番用（PostgreSQL、キャッシュ ON）
#  デフォルトは dev。本番では起動時に --spring.profiles.active=prod を付ける。
# ============================================================================
spring:
  application:
    name: komeko-order

  profiles:
    active: dev

  # ==========================================================================
  #  Flyway（スキーマ変更の管理）
  # ==========================================================================
  #  ★ 既定は「無効」です。
  #    dev とテストは今までどおり Hibernate の ddl-auto に任せます
  #    （dev は update、テストは create-drop。どちらも作り直しが自由な環境）。
  #    本番だけ application-prod.yml で有効にします。
  #    本番は ddl-auto: validate なので、テーブルを作るのは Flyway の仕事になります。
  #
  #    ライブラリを入れると既定で有効になってしまうため、ここで明示的に切っています。
  #    これを書き忘れると、開発中の DB にも勝手にマイグレーションが走ります。
  flyway:
    enabled: false

  jpa:
    # open-in-view=false : 「View を描画する間も DB 接続を握りっぱなし」をやめる設定。
    # 初心者向けチュートリアルでは true のままのことが多いが、
    # 接続が枯渇しやすく本番では非推奨なので最初から false にしておく。
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tokyo

  servlet:
    multipart:
      # 商品画像のアップロード上限
      max-file-size: 5MB
      max-request-size: 6MB

  mvc:
    hiddenmethod:
      filter:
        # HTML のフォームは GET/POST しか送れないため、
        # <input type="hidden" name="_method" value="delete"> で DELETE を表現できるようにする
        enabled: true

  messages:
    basename: messages
    encoding: UTF-8

  # ==========================================================================
  #  静的ファイル（CSS・JS・画像）のキャッシュ
  # ==========================================================================
  #  これを入れる前、公開デモの app.css には
  #      Cache-Control: no-cache, no-store, max-age=0, must-revalidate
  #  が付いていました。Spring Security が全レスポンスに付ける既定のヘッダで、
  #  本来は「ログイン後の画面が戻るボタンで見えてしまう」のを防ぐためのものです。
  #  ところが静的ファイルにも同じものが乗るため、
  #  画面を移動するたびに CSS も JS もロゴも取り直していました。
  #
  #  1 往復 150ms の回線では、これが体感の重さを作ります。
  #  （手元では往復 8ms なので、まったく気づけませんでした）
  #
  #  ── なぜ max-age だけでは駄目か ──
  #  1 年キャッシュさせると、CSS を直しても戻ってきた人の画面が変わりません。
  #  そこで内容から作ったハッシュをファイル名に混ぜます。
  #      /css/app.css  →  /css/app-9f3c1b….css
  #  中身が変わればハッシュが変わり、URL ごと別物になるので、
  #  「ずっとキャッシュさせる」と「直したら必ず届く」を両立できます。
  #
  #  テンプレート側は th:href="@{/css/app.css}" のままで構いません。
  #  Spring がハッシュ付きの URL に書き換えてくれます。
  #  （逆に言うと、素の href="/css/app.css" と書いた箇所は書き換わりません）
  # ==========================================================================
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

server:
  port: 8080
  servlet:
    session:
      # カートはセッションに置くので、来店中に切れない長さにする
      timeout: 3h
    encoding:
      charset: UTF-8
      force: true

# ----------------------------------------------------------------------------
#  アプリ固有の設定（AppProperties クラスに読み込まれる）
# ----------------------------------------------------------------------------
app:
  # QR コードに埋め込む URL のベース。
  # スマホから開けるようにするには、この PC の Wi-Fi 側 IP を指定する
  # （localhost のままだと、スマホは「スマホ自身」を探しに行って失敗する）。
  # ⚠ この IP は DHCP なので変わりうる。ルーターの「DHCP 固定割当」で
  #    この PC に 192.168.1.4 を予約しておくこと（docs/ネットワーク設定.md）。
  base-url: http://192.168.1.4:8080
  # 商品画像の保存先（アプリからの相対パス）
  upload-dir: ./data/uploads
  # 起動時にサンプルメニュー・初期スタッフを投入するか
  seed-on-startup: true

  # 初期管理者（初回起動時のみ作成される）
  #
  # ★ パスワードは空のままにしておくこと ★
  #   空にしておくと、初回起動時にランダムなパスワードが自動生成され、
  #   起動ログに 1 回だけ表示されます。ログイン後すぐ変更してください。
  #
  #   ここに固定のパスワードを書くと、そのファイルを Git にコミットした瞬間に
  #   パスワードが履歴に残ります。Git の履歴はあとから消すのが非常に大変なので、
  #   「設定ファイルに秘密を書かない」を最初から徹底するのが結局いちばん楽です。
  #
  #   どうしても固定したい場合は環境変数で渡してください:
  #     $env:INITIAL_ADMIN_PASSWORD = "..."   (PowerShell)
  initial-admin-username: admin
  initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}

  # ── スタッフ画面の接続元制限（第二の錠） ──────────────────────
  # ここに IP を書くと、/login /kitchen /hall /admin は
  # その IP からしか開けなくなる（お客さまの端末にはログイン画面すら出ない）。
  # 使い方:
  #   1. ルーターの「DHCP固定割当」でスタッフ端末の IP を予約する
  #   2. その IP を下に並べて再起動
  #   3. スマホ（許可外）で /login を開いて 403 になることを確認
  # 空のままなら制限なし。サーバPC自身(localhost)は常に許可される（閉め出し防止）。
  staff-access:
    allowed-ips: []
    # 例:
    # allowed-ips:
    #   - 192.168.1.21      # 厨房タブレット
    #   - 192.168.1.22      # ホールタブレット
    #   - 192.168.1.0/28    # 範囲でまとめる書き方（.0〜.15）

  # ── 仕入れ・在庫モジュール ────────────────────────────────────
  # レシートを撮って仕入れ・経費を記録し、原価率を出す機能。
  #
  # ★ enabled: false のとき、この機能の画面は「そもそも組み込まれず」URL ごと消えます。
  #   本番で何かあったとき、コードを直して再ビルドするのではなく
  #   ここを false にして再起動すれば従来の姿に戻せます（非常口）。
  inventory:
    enabled: true
    # 受領から何日以内の登録なら期限内とみなすか。
    # 電子帳簿保存法の「速やか」は概ね 7 営業日だが、営業日は定休日に左右されて
    # 数えにくいので、より厳しい暦日で判定する（早く警告が出るぶんには害がない）。
    input-deadline-days: 7
    # 税率・控除率マスタの期限切れを何日前から警告するか。
    # データ駆動の弱点は「制度が変わったことに人が気づかない」こと。その保険。
    rate-warning-days: 90
    # レシート画像に求める最低画素数（200dpi 相当の目安）。
    # 足りなくても保存は止めず、撮り直しを促すだけにする。
    min-image-pixels: 1000000
    ocr:
      # ★ API キーは環境変数で渡すこと。ここに直接書かない。
      #     $env:ANTHROPIC_API_KEY = "sk-ant-..."   (PowerShell)
      #   未設定でもアプリは通常どおり起動し、手入力での記録はできます
      #   （読み取りボタンだけが無効になる）。
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-5
      timeout-ms: 120000

  # ── 自動バックアップ ──────────────────────────────────────────
  # DB（注文・伝票・会計）と商品画像を、定期的に別フォルダへ退避する。
  # 停電では DB は壊れないが、ディスク故障では全部消える。その保険。
  backup:
    enabled: true
    # 保存先。できれば別ドライブを指すよう変更するとなお安全（.gitignore 済み）
    dir: ./backups
    # 毎日 4:30（閉店 26:00 の後、営業日切替 5:00 の前）。書式は「秒 分 時 日 月 曜日」
    cron: "0 30 4 * * *"
    # 残す世代数。超えた分は古いものから自動削除
    keep: 14
    # アプリを閉じたときにも 1 回取る（閉店後に PC を落とす店ではこれが本命）
    backup-on-shutdown: true
    # 起動時の「追いつき」。最後のバックアップから startup-max-age-hours 以上
    # 空いていたら、起動した瞬間に 1 本取る。
    # 定時(4:30)に PC が落ちていた日や、前夜に電源を直接切られた日でも、
    # 翌日の起動時に必ず追いつけるようにするための保険
    backup-on-startup: true
    startup-max-age-hours: 20
    # 前回成功から N 分以内の自動バックアップは見送る（開発中の再起動連発対策）
    min-interval-minutes: 10
    # ── 2次コピー先（ディスク 1 台の故障に備える保険） ──
    #
    # ★ ここが空だと、DB・画像・バックアップ 14 世代が全部 C: の 1 枚に載ります。
    #   停電では H2 は壊れませんが、ディスクが物理的に壊れると 3 つ同時に消えます。
    #   （docs\データベース.md の「いまの弱点」がこれです）
    #
    # K: は C: とは別の物理ディスク（WD 8TB HDD）なので、
    # C: の NVMe が飛んでもバックアップは残ります。
    # 空きが桁違いに大きいドライブを選んだのは、下の注意のためです。
    #
    # ⚠ 2次コピー先には世代の間引き（prune）が効きません。
    #   keep: 14 が効くのは上の dir だけで、こちらは増え続けます。
    #   レシート画像が貯まると 1 世代が重くなるので、
    #   年に一度くらいは K:\komeko-backup の古い世代を手で消してください。
    #   （容量に余裕があるうちは放っておいても実害はありません）
    #
    # ⚠ これは「別のディスク」の保険であって「別の場所」の保険ではありません。
    #   火事・盗難・水濡れでは PC ごと失われます。
    #   店の外に置きたくなったら OneDrive 等を指定できますが、
    #   そのときは店のデータが PC の外に出る、という判断が別途必要です。
    extra-copy-dir: "K:\\komeko-backup"

logging:
  level:
    jp.komeko.order: INFO
