#
# ============================================================================
#  demo プロファイル : ポートフォリオの公開デモ用
# ============================================================================
#  採用担当の方に「触って確かめてもらう」ための設定です。
#  実店舗（prod）とも手元（dev）とも目的が違うので、別に分けています。
#
#      dev  … 自分の PC で作りながら動かす
#      prod … 実店舗。PostgreSQL・データは絶対に消えない前提
#      demo … 誰でも触れる公開版。壊されても構わない・毎回作り直す
#
#  ---------------------------------------------------------------------------
#  起動のしかた（Render などの無料ホスティング）
#  ---------------------------------------------------------------------------
#      SPRING_PROFILES_ACTIVE=demo
#      APP_BASE_URL=https://＜あなたのデモの URL＞     ← これが最重要
#
#  APP_BASE_URL は QR コードに焼き込まれる URL です。
#  ここが手元の LAN アドレス（192.168.x.x）のままだと、
#  QR を読んでも外からは開けません。必ず公開 URL にしてください。
# ============================================================================
spring:
  datasource:
    # ---------------------------------------------------------------------
    # H2 のファイル DB をそのまま使う（PostgreSQL を用意しない）
    #
    # 無料ホスティングの多くは「再起動するとファイルが消える」作りです。
    # 本来これは困った性質ですが、デモに限っては都合が良い。
    #   ・誰かが注文を荒らしても、次の再起動できれいに戻る
    #   ・DB の契約も期限も要らない
    # 消えて困るデータが最初から無いので、この割り切りが成立します。
    # ---------------------------------------------------------------------
    url: jdbc:h2:file:./data/komeko-demo;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 毎回まっさらから作り直すので update で問題ない。
      # 実店舗（prod）は validate。あちらは勝手に列を変えられると困る。
      ddl-auto: update
    show-sql: false

  thymeleaf:
    # 画面は書き換えないのでキャッシュする（表示が速くなる）
    cache: true

  h2:
    console:
      # 誰でも触れる場所に DB のコンソールを出してはいけない
      enabled: false

  devtools:
    restart:
      enabled: false

# ============================================================================
#  リバースプロキシ（TLS 終端）の裏で動かすための設定
# ============================================================================
#  Render は「入口で HTTPS を受け、アプリへは平文 HTTP で渡す」作りです。
#  アプリから見ると通信は http なので、放っておくと次のことが起きます。
#
#   ・request.getScheme() が "http" のまま
#   ・Spring Boot は Tomcat の useRelativeRedirects を false に固定するため、
#     リダイレクトの Location が絶対 URL で組み立てられる
#     → Location: http://＜公開URL＞/kitchen
#   ・その平文 URL へ 1 往復してから Render が https へ戻す
#   ・直前に発行された JSESSIONID が、その平文リクエストに乗る
#   ・request.isSecure() が false なので Strict-Transport-Security も出ない
#
#  画面は動くので気付けません。実際、公開後に外から叩いて初めて分かりました。
#
#  ---------------------------------------------------------------------------
#  dev / prod には書かない
#  ---------------------------------------------------------------------------
#  手元も実店舗も前段にプロキシが無く、X-Forwarded-* を送ってくる相手がいません。
#  そこで信じる設定を入れると、ヘッダを騙るリクエストを信じることになります。
#  「プロキシの裏にいる」ことが確実な demo だけに書くのが正しい置き場所です。
# ============================================================================
server:
  # X-Forwarded-Proto / X-Forwarded-Host を解釈させる。
  # framework は ForwardedHeaderFilter（Spring 側の実装）を使う指定。
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        # ★ 上の設定だけでは Secure は付かない。
        # ForwardedHeaderFilter は「リクエストの包み紙」を差し替えるだけで、
        # Cookie を発行する Tomcat 本体の isSecure() は false のままだからです。
        # 公開デモは常に HTTPS 越しなので、ここは明示して付けます。
        #
        # なお、この設定のせいで demo プロファイルを手元の http で動かすと
        # ログインできなくなります（Cookie がブラウザに保存されない）。
        # 手元で確認するときは dev プロファイル（tools\run.ps1）を使ってください。
        secure: true
        same-site: lax

app:
  # ★ 必ず環境変数で公開 URL を渡すこと。QR に焼き込まれる値。
  #
  # 末尾の「:」は「環境変数が無ければ空」という既定値の指定です。
  # これを書かずに ${APP_BASE_URL} とだけ書くと、変数が未設定のとき
  # Spring は Could not resolve placeholder で<b>起動そのものを中止</b>します。
  #
  # 初回デプロイでは、URL がまだ発行されていないので値を入れようがありません。
  # 「表示用の URL が分からない」という理由でシステム全体が起動しないのは、
  # 釣り合いが取れていません。空なら http://localhost:8080 として扱われ、
  # QR 画面の上部に「この値のままでは使えません」という警告が出ます。
  # 止めるのではなく、気付ける形にして動かす、という判断です。
  base-url: ${APP_BASE_URL:}

  # メニュー・卓・初期アカウントを毎回作る（DB が消えるため）
  seed-on-startup: true

  # ログイン画面に「ゲストで参加する」を出す
  guest-login: true

  # 起動時に、いかにも営業中の状態を作る
  # （厨房ボードが埋まり、在庫の残数と売り切れも映る）
  demo-data: true

  # ログイン画面に出る名前。実在のスタッフと区別が付くようにしておく
  guest-display-name: 見学者

  # ---------------------------------------------------------------------
  # スタッフ画面の接続元制限は使わない。
  # 実店舗では「店の中からしか開けない」ようにする第二の錠ですが、
  # デモは世界中から見てもらうためのものなので、ここで縛ると本末転倒です。
  # 代わりにゲストの権限そのものを絞っています（SecurityConfig）。
  # ---------------------------------------------------------------------
  staff-access:
    allowed-ips: []

  backup:
    # 消えて困るデータが無いので、バックアップは動かさない。
    # 無料枠のディスクを食うだけになる。
    enabled: false

logging:
  level:
    jp.komeko.order: INFO
    org.hibernate.SQL: WARN
