#
# ============================================================================
#  demo プロファイル : ポートフォリオの公開デモ用
# ============================================================================
#  採用担当の方に「触って確かめてもらう」ための設定です。
#  実店舗（prod）とも手元（dev）とも目的が違うので、別に分けています。
#
#      dev  … 自分の PC で作りながら動かす
#      prod … 実店舗。PostgreSQL・データは絶対に消えない前提
#      demo … 誰でも触れる公開版。壊されても構わない・毎回作り直す
#
#  ---------------------------------------------------------------------------
#  起動のしかた（Render などの無料ホスティング）
#  ---------------------------------------------------------------------------
#      SPRING_PROFILES_ACTIVE=demo
#      APP_BASE_URL=https://＜あなたのデモの URL＞     ← これが最重要
#
#  APP_BASE_URL は QR コードに焼き込まれる URL です。
#  ここが手元の LAN アドレス（192.168.x.x）のままだと、
#  QR を読んでも外からは開けません。必ず公開 URL にしてください。
# ============================================================================
spring:
  datasource:
    # ---------------------------------------------------------------------
    # H2 のファイル DB をそのまま使う（PostgreSQL を用意しない）
    #
    # 無料ホスティングの多くは「再起動するとファイルが消える」作りです。
    # 本来これは困った性質ですが、デモに限っては都合が良い。
    #   ・誰かが注文を荒らしても、次の再起動できれいに戻る
    #   ・DB の契約も期限も要らない
    # 消えて困るデータが最初から無いので、この割り切りが成立します。
    # ---------------------------------------------------------------------
    url: jdbc:h2:file:./data/komeko-demo;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 毎回まっさらから作り直すので update で問題ない。
      # 実店舗（prod）は validate。あちらは勝手に列を変えられると困る。
      ddl-auto: update
    show-sql: false

  thymeleaf:
    # 画面は書き換えないのでキャッシュする（表示が速くなる）
    cache: true

  h2:
    console:
      # 誰でも触れる場所に DB のコンソールを出してはいけない
      enabled: false

  devtools:
    restart:
      enabled: false

app:
  # ★ 必ず環境変数で公開 URL を渡すこと。QR に焼き込まれる値。
  base-url: ${APP_BASE_URL}

  # メニュー・卓・初期アカウントを毎回作る（DB が消えるため）
  seed-on-startup: true

  # ログイン画面に「ゲストで参加する」を出す
  guest-login: true

  # 起動時に、いかにも営業中の状態を作る
  # （厨房ボードが埋まり、在庫の残数と売り切れも映る）
  demo-data: true

  # ログイン画面に出る名前。実在のスタッフと区別が付くようにしておく
  guest-display-name: 見学者

  # ---------------------------------------------------------------------
  # スタッフ画面の接続元制限は使わない。
  # 実店舗では「店の中からしか開けない」ようにする第二の錠ですが、
  # デモは世界中から見てもらうためのものなので、ここで縛ると本末転倒です。
  # 代わりにゲストの権限そのものを絞っています（SecurityConfig）。
  # ---------------------------------------------------------------------
  staff-access:
    allowed-ips: []

  backup:
    # 消えて困るデータが無いので、バックアップは動かさない。
    # 無料枠のディスクを食うだけになる。
    enabled: false

logging:
  level:
    jp.komeko.order: INFO
    org.hibernate.SQL: WARN
