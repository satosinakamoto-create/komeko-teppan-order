#
# ============================================================================
#  prod プロファイル : 本番用
# ============================================================================
#  DB の接続情報は環境変数で渡す。ソースにパスワードを書かないこと。
#    DB_URL=jdbc:postgresql://host:5432/komeko
#    DB_USER=komeko
#    DB_PASSWORD=********
#
#  ddl-auto は validate（テーブルを勝手に変更しない）。
#  スキーマ変更は本来 Flyway / Liquibase といったマイグレーションツールで管理する。
#  → docs/仕様.md「今後の課題」を参照。
# ============================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # ==========================================================================
  #  Flyway : 本番のスキーマ変更はここで管理する
  # ==========================================================================
  #  ddl-auto: validate なので、テーブルは Hibernate では作られません。
  #  「どの SQL をどの順で流したか」を DB 自身（flyway_schema_history）に
  #  記録させ、同じ変更が二度流れないようにします。
  #
  #  baseline-on-migrate: true / baseline-version: 1
  #    このアプリは Flyway 導入より前から動いていて、既存の 13 テーブルは
  #    Hibernate が作りました。その状態を「バージョン 1 まで適用済み」と
  #    見なす指定です。これが無いと Flyway は
  #    「空でない DB に初回マイグレーションはできない」と言って起動を止めます。
  #    実際に流れる最初の SQL は V2__inventory_step1.sql です。
  #
  #  ⚠ 初回デプロイの前に、ステージングで一度流して
  #    「Flyway がテーブルを作り、Hibernate の validate が通る」ことを
  #    必ず確認してください。SQL は H2 と PostgreSQL の両対応で書いてありますが、
  #    PostgreSQL 実機での検証はまだです。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "komeko-order の既存スキーマ（Flyway 導入前）"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  thymeleaf:
    cache: true

  h2:
    console:
      enabled: false

  devtools:
    restart:
      enabled: false

app:
  base-url: ${APP_BASE_URL}
  seed-on-startup: false

logging:
  level:
    jp.komeko.order: INFO
    org.hibernate.SQL: WARN
