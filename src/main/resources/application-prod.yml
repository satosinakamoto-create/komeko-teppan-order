#
# ============================================================================
#  prod プロファイル : 本番用
# ============================================================================
#  DB の接続情報は環境変数で渡す。ソースにパスワードを書かないこと。
#    DB_URL=jdbc:postgresql://host:5432/komeko
#    DB_USER=komeko
#    DB_PASSWORD=********
#
#  ddl-auto は validate（テーブルを勝手に変更しない）。
#  スキーマ変更は本来 Flyway / Liquibase といったマイグレーションツールで管理する。
#  → docs/仕様.md「今後の課題」を参照。
# ============================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # ==========================================================================
  #  Flyway : 本番のスキーマ変更はここで管理する
  # ==========================================================================
  #  ddl-auto: validate なので、テーブルは Hibernate では作られません。
  #  「どの SQL をどの順で流したか」を DB 自身（flyway_schema_history）に
  #  記録させ、同じ変更が二度流れないようにします。
  #
  #  baseline-on-migrate: true / baseline-version: 1
  #    このアプリは Flyway 導入より前から動いていて、既存の 13 テーブルは
  #    Hibernate が作りました。その状態を「バージョン 1 まで適用済み」と
  #    見なす指定です。これが無いと Flyway は
  #    「空でない DB に初回マイグレーションはできない」と言って起動を止めます。
  #    実際に流れる最初の SQL は V2__inventory_step1.sql です。
  #
  #  ⚠ 初回デプロイの前に、ステージングで一度流して
  #    「Flyway がテーブルを作り、Hibernate の validate が通る」ことを
  #    必ず確認してください。SQL は H2 と PostgreSQL の両対応で書いてありますが、
  #    PostgreSQL 実機での検証はまだです。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "komeko-order の既存スキーマ（Flyway 導入前）"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  thymeleaf:
    cache: true

  h2:
    console:
      enabled: false

  devtools:
    restart:
      enabled: false

app:
  base-url: ${APP_BASE_URL}
  seed-on-startup: false

  # ==========================================================================
  #  自動バックアップは本番では動かない（無効にしておく）
  # ==========================================================================
  #  BackupService は H2 のファイル DB を丸ごとコピーする作りで、
  #  PostgreSQL では最初の isH2() チェックで例外になり、
  #  DB だけでなく画像の zip も含めて何ひとつ実行されません。
  #
  #  それでも有効のままだと、毎日 4:30・起動時・終了時に
  #  「対象外」の例外が出て ERROR ログだけが残り続けます。
  #  本物の異常がそこに埋もれるので、明示的に切ります。
  #  （demo プロファイルでは同じ理由ですでに切ってあります）
  #
  #  ★★ 切ることで守られるわけではありません ★★
  #  この 1 行は「ログが汚れるのを止める」だけで、
  #  本番のバックアップは<b>存在しない</b>状態になります。
  #  PostgreSQL に移行するなら、次の 2 つを別に用意してください。
  #
  #    1. DB    … pg_dump の定期実行（Render なら Managed Postgres の
  #                自動バックアップ、自前なら cron + pg_dump）
  #    2. 画像  … data/uploads は DB の外なので pg_dump では守れない。
  #                商品画像に加えて<b>レシート画像</b>が入るため、
  #                電子帳簿保存法の証憑として 7〜10 年の保管が要る。
  #                オブジェクトストレージ（S3 等）へ置くのが素直。
  #
  #  ⚠ Render の無料枠はディスクが再起動で消えます。
  #    レシート画像をそこに置くと、証憑が消えます。
  #    本番の置き場所を決めるときに必ず確認してください。
  backup:
    enabled: false

logging:
  level:
    jp.komeko.order: INFO
    org.hibernate.SQL: WARN
